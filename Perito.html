<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:15px;}
.page{display:none;max-width:600px;margin:0 auto;padding:16px 16px 100px;}
.page.ativo{display:block;}
h1{font-size:22px;color:#1e3a5f;margin:0 0 4px;}
h2{font-size:14px;color:#555;margin:0 0 16px;font-weight:normal;}
h3{font-size:15px;color:#1e3a5f;margin:12px 0 8px;}
.card{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:4px;}
input,select,textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px 12px;font-size:14px;background:#fff;margin-bottom:12px;font-family:Arial,sans-serif;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1e3a5f;box-shadow:0 0 0 2px rgba(30,58,95,.15);}
textarea{resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;}
.btn-primary{background:#1e3a5f;color:#fff;}
.btn-red{background:#9b1c1c;color:#fff;}
.btn-dark{background:#222;color:#fff;}
.btn-outline{background:#fff;color:#555;border:1px solid #ccc;}
.btn-green{background:#16a34a;color:#fff;}
.btn-amber{background:#b45309;color:#fff;}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:6px;}
.btn-full{width:100%;}
.btn-danger{background:#dc2626;color:#fff;}
.fixed-bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0d8;padding:12px 16px;display:flex;gap:8px;z-index:100;}
.fixed-bottom .btn{flex:1;}
.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.laudo-item{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:14px;margin-bottom:10px;}
.laudo-item .nome{font-weight:700;font-size:15px;}
.laudo-item .sub{font-size:12px;color:#777;margin-top:2px;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:4px;}
.badge-ok{background:#dcfce7;color:#15803d;}
.badge-indet{background:#fef3c7;color:#b45309;}
.badge-and{background:#f1f5f9;color:#475569;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;}
.tab{white-space:nowrap;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:#e5e5e0;color:#555;}
.tab.ativo{background:#1e3a5f;color:#fff;}
.tab-content{display:none;}
.tab-content.ativo{display:block;}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer;}
.chip.ativo{background:#1e3a5f;color:#fff;border-color:#1e3a5f;}
.foto-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid #ccc;border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff;}
.foto-item.feita{background:#f0fdf4;border-color:#16a34a;color:#15803d;}
.section-title{font-size:13px;font-weight:700;color:#1e3a5f;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #e0e8f0;}
.info-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:12px;color:#1e40af;margin-bottom:10px;}
.info-box.amber{background:#fffbeb;border-color:#fcd34d;color:#92400e;}
.judgment-btns{display:flex;gap:8px;margin-bottom:10px;}
.judgment-btns .btn{flex:1;font-size:12px;padding:9px 6px;}
.jbox-a{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px;margin-bottom:8px;}
.jbox-b{background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:10px;margin-bottom:8px;}
.jbox-a textarea,.jbox-b textarea{border:none;background:transparent;padding:0;margin:0;}
.sistema-row{border:1px solid #e0e0d8;border-radius:8px;margin-bottom:6px;overflow:hidden;}
.sistema-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;background:#fff;}
.sistema-header:active{background:#f5f5f0;}
.sistema-body{padding:12px;border-top:1px solid #e0e0d8;background:#fafaf8;}
.sim-nao{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0ec;}
.sim-nao:last-child{border-bottom:none;}
.sim-nao span{font-size:13px;color:#444;}
.sim-nao .btns{display:flex;gap:6px;}
.sn-btn{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid #ccc;background:#fff;color:#555;cursor:pointer;}
.sn-sim.ativo{background:#16a34a;color:#fff;border-color:#16a34a;}
.sn-nao.ativo{background:#dc2626;color:#fff;border-color:#dc2626;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot-green{background:#16a34a;}
.dot-red{background:#dc2626;}
.dot-gray{background:#ccc;}
.vitima-card{border:1px solid #e0e0d8;border-radius:8px;padding:12px;margin-bottom:10px;}
.vitima-card h4{font-size:13px;font-weight:700;color:#666;margin:0 0 8px;}
.lesao-tag{display:inline-flex;align-items:center;gap:4px;background:#fee2e2;color:#9b1c1c;border:1px solid #fca5a5;border-radius:20px;padding:3px 10px;font-size:12px;margin:2px;}
.lesao-tag button{background:none;border:none;cursor:pointer;font-weight:700;color:#9b1c1c;padding:0;font-size:14px;line-height:1;}
.confirm-del{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:12px;margin-top:8px;}
.txt-preview{background:#fff;border:1px solid #e0e0d8;border-radius:8px;padding:14px;white-space:pre-wrap;font-size:13px;line-height:1.6;color:#333;}
.empty-state{text-align:center;padding:48px 16px;color:#999;font-size:14px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:16px;}
.modal-overlay.ativo{display:flex;}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:20px;}
.modal h3{margin:0 0 16px;}
.gps-info{font-size:12px;color:#555;margin-top:4px;margin-bottom:10px;}
.agente-group{margin-bottom:4px;}
.agente-group summary{font-size:12px;font-weight:700;color:#555;padding:4px 0;cursor:pointer;}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
#mapPOI-p{width:100%;height:55vh;border-radius:10px;margin-bottom:10px;}
.city-lbl-p{background:none!important;border:none!important;box-shadow:none!important;color:#1C1C1E;font-size:9px;font-weight:700;white-space:nowrap;}
</style>
</head>
<body>

<!-- LISTA -->
<div id="pg-lista" class="page ativo">
  <div class="header">
    <div><h1>App do Perito</h1><h2>Laudo Pericial de Incêndio</h2></div>
    <div style="display:flex;gap:6px;">
      <button class="btn btn-outline btn-sm" onclick="irPontos()">📍 Pontos</button>
      <button class="btn btn-primary" onclick="abrirModalNovo()">+ Novo</button>
    </div>
  </div>
  <div style="margin-bottom:12px;">
    <input type="file" id="file-importar" accept=".json" style="display:none" onchange="importarArquivo(this)">
    <button class="btn btn-outline btn-sm" onclick="document.getElementById('file-importar').click()">⬇ Importar do Chefe de Socorro</button>
  </div>
  <div id="lista-laudos"></div>
</div>

<!-- EDITOR -->
<div id="pg-editor" class="page">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
    <button class="btn btn-outline btn-sm" onclick="voltarLista()">← Voltar</button>
    <div style="flex:1;min-width:0;">
      <div id="ed-titulo" style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
      <div id="ed-subtitulo" style="font-size:12px;color:#777;"></div>
    </div>
    <div id="ed-badge"></div>
  </div>
  <div class="tabs">
    <button class="tab ativo" onclick="mudarTab('p1')">1. Identificação</button>
    <button class="tab" onclick="mudarTab('p2')">2. F. Passiva</button>
    <button class="tab" onclick="mudarTab('p3')">3. F. Ativa</button>
    <button class="tab" onclick="mudarTab('p4')">4. Investigativa</button>
    <button class="tab" onclick="mudarTab('p5')">5. Conclusão</button>
  </div>
  <div id="tab-p1" class="tab-content ativo"></div>
  <div id="tab-p2" class="tab-content"></div>
  <div id="tab-p3" class="tab-content"></div>
  <div id="tab-p4" class="tab-content"></div>
  <div id="tab-p5" class="tab-content"></div>
  <div class="fixed-bottom">
    <button class="btn btn-dark" onclick="verLaudo()">Ver laudo completo →</button>
  </div>
</div>

<!-- PREVIEW -->
<div id="pg-preview" class="page">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
    <button class="btn btn-outline btn-sm" onclick="irEditor()">← Voltar</button>
    <span style="font-weight:700;">Laudo (texto)</span>
  </div>
  <div class="txt-preview" id="txt-laudo"></div>
  <div class="fixed-bottom">
    <button class="btn btn-outline" onclick="copiarLaudo()">📋 Copiar</button>
    <button class="btn btn-red" onclick="baixarLaudo()">⬇ Baixar .txt</button>
  </div>
</div>

<!-- MODAL NOVO -->
<div class="modal-overlay" id="modal-novo">
  <div class="modal">
    <h3>Novo laudo</h3>
    <div id="modal-importado" style="display:none" class="info-box" style="margin-bottom:12px;"></div>
    <label>Nº do Laudo Pericial *</label>
    <input id="novo-numero" type="text" placeholder="Ex: 1260/7ºBBM/2019">
    <label>RE da Edificação (se houver)</label>
    <div style="display:flex;gap:6px;margin-bottom:6px;">
      <input id="novo-re" type="text" placeholder="Ex: RE8013000123A" style="flex:1;">
      <button type="button" onclick="buscarEdifPorRE()" style="background:#C0272D;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:.85rem;font-weight:700;cursor:pointer;">🔍 Buscar</button>
    </div>
    <button type="button" onclick="toggleEdifManual()" id="btnEdifManual" style="width:100%;margin-bottom:6px;padding:7px;background:#f8fafc;border:1.5px dashed #94a3b8;border-radius:8px;font-size:.82rem;color:#64748b;cursor:pointer;">✏️ Dados manuais (sem RE)</button>
    <div id="edifManualBloco" style="display:none;background:#f8fafc;border-radius:10px;padding:10px;margin-bottom:8px;border:1.5px solid #e2e8f0;">
      <div style="font-size:.75rem;font-weight:800;color:#64748b;margin-bottom:8px;">📋 DADOS MANUAIS DA EDIFICAÇÃO</div>
      <input id="man-nome" class="fi" placeholder="Nome/Razão Social *" style="margin-bottom:5px;">
      <input id="man-endereco" class="fi" placeholder="Endereço" style="margin-bottom:5px;">
      <div style="display:flex;gap:6px;margin-bottom:5px;">
        <input id="man-municipio" class="fi" placeholder="Município" style="flex:1;">
        <input id="man-grau" class="fi" placeholder="Grau risco" style="flex:0 0 90px;">
      </div>
      <input id="man-resp" class="fi" placeholder="Responsável pelo bloco" style="margin-bottom:5px;">
      <input id="man-resp-tel" class="fi" placeholder="Telefone do responsável" style="margin-bottom:5px;">
      <input id="man-obs" class="fi" placeholder="Observações / contexto" style="margin-bottom:0;">
    </div>
    <div id="re-resultado" style="display:none;background:#f0fdf4;border:1.5px solid #16a34a;border-radius:8px;padding:12px;margin-bottom:8px;">
      <div style="font-size:.78rem;font-weight:800;color:#16a34a;margin-bottom:8px;">✅ Edificação encontrada</div>
      <div style="display:grid;gap:5px;margin-bottom:8px;">
        <input id="re-nome" class="fi" placeholder="Nome/Razão Social" style="font-size:.85rem;">
        <input id="re-endereco" class="fi" placeholder="Endereço" style="font-size:.85rem;">
        <div style="display:flex;gap:6px;">
          <input id="re-municipio" class="fi" placeholder="Município" style="flex:1;font-size:.85rem;">
          <input id="re-grau" class="fi" placeholder="Grau risco" style="flex:0 0 90px;font-size:.85rem;">
        </div>
        <input id="re-resp-nome" class="fi" placeholder="Responsável" style="font-size:.85rem;">
        <input id="re-resp-tel" class="fi" placeholder="Telefone resp." style="font-size:.85rem;">
        <input id="re-venc-func" class="fi" type="date" style="font-size:.85rem;">
      </div>

function aplicarImportacao(l,p){
  if(p.numero) l.numOcorrencia=p.numero;
  if(p.data) l.data=p.data;
  if(p.hora) l.hora=p.hora;
  if(p.municipio) l.cidade=p.municipio;
  if(p.local) l.endereco=p.local;
  if(p.bairro) l.bairro=p.bairro;
  if(p.cep) l.cep=p.cep;
  if(p.gps&&p.gps.lat) l.gps=p.gps;
  if(p.construtivas){
    if(p.construtivas.estrutura) l.estrutura=p.construtivas.estrutura;
    if(p.construtivas.teto) l.teto=p.construtivas.teto;
    if(p.construtivas.parede) l.parede=p.construtivas.parede;
    if(p.construtivas.piso) l.piso=p.construtivas.piso;
  }
  if(p.areaAtingidaM2) l.areaAtingida=p.areaAtingidaM2;
  if(p.estrategiaCombate) l.estrategiaCombate=p.estrategiaCombate;
  if(p.tecnicaCombate) l.tecnicaCombate=p.tecnicaCombate;
  if(p.localEntrada) l.localEntrada=p.localEntrada;
  if(p.aberturaForcada) l.forcada=p.aberturaForcada;
  if(p.aberturaForcadaDetalhe) l.forcadaDetalhe=p.aberturaForcadaDetalhe;
  var notas=[];
  if(p.obs) notas.push('Obs. chefe de socorro: '+p.obs);
  if(p.dificuldades&&p.dificuldades.length) notas.push('Dificuldades: '+p.dificuldades.join(', '));
  if(p.apoios&&p.apoios.length) notas.push('Apoios: '+p.apoios.join(', '));
  if(p.perigos&&p.perigos.length) notas.push('Perigos: '+p.perigos.join(', '));
  if(notas.length) l.dificuldades=notas.join(' | ');
  if(p.vitimas&&(p.vitimas.lista||[]).length) l.vitimas=p.vitimas;
  if(p.fotos){ Object.keys(p.fotos).forEach(function(k){ if(l.fotosObr.hasOwnProperty(k)) l.fotosObr[k]=p.fotos[k]; }); }
  return l;
}

function renderLista(){
  var lista=carregarIdx();
  var el=document.getElementById('lista-laudos');
  if(!lista.length){ el.innerHTML='<div class="empty-state">Nenhum laudo.<br>Crie um novo ou importe do Chefe de Socorro.</div>'; return; }
  lista.sort(function(a,b){ return b.ts-a.ts; });
  el.innerHTML=lista.map(function(item){
    var st=item.status==='determinada'?'<span class="badge badge-ok">✓ Causa determinada</span>':
           item.status==='indeterminada'?'<span class="badge badge-indet">⚠ Causa indeterminada</span>':
           '<span class="badge badge-and">Em andamento</span>';
    var del=confirmandoDel===item.id?
      '<div class="confirm-del"><p style="font-size:13px;margin:0 0 8px;">Excluir permanentemente?</p>'+
      '<div style="display:flex;gap:8px;"><button class="btn btn-danger btn-sm" onclick="confirmarDel(\''+item.id+'\')">Excluir</button>'+
      '<button class="btn btn-outline btn-sm" onclick="cancelarDel()">Cancelar</button></div></div>':'';
    return '<div class="laudo-item">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'+
      '<div onclick="abrirLaudo(\''+item.id+'\')" style="flex:1;cursor:pointer;">'+
      '<div class="nome">Laudo nº '+(item.numero||'—')+'</div>'+
      '<div class="sub">Certidão nº '+(item.certidao||'—')+'</div>'+
      (item.apelido?'<div class="sub">'+item.apelido+'</div>':'')+
      st+
      '</div>'+
      '<button class="btn btn-outline btn-sm" onclick="pedirDel(\''+item.id+'\')">🗑</button>'+
      '</div>'+del+'</div>';
  }).join('');
}
function pedirDel(id){ confirmandoDel=id; renderLista(); }
function cancelarDel(){ confirmandoDel=null; renderLista(); }
function confirmarDel(id){ excluirL(id); var l=carregarIdx().filter(function(i){ return i.id!==id; }); salvarIdx(l); confirmandoDel=null; renderLista(); }

function importarArquivo(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var p=JSON.parse(ev.target.result);
      if(p.__tipo!=='socorro-incendio-v2'){ alert('Arquivo não reconhecido. Use o arquivo gerado pelo App do Chefe de Socorro para ocorrências de incêndio.'); return; }
      importPacote=p;
      var box=document.getElementById('modal-importado');
      box.style.display='block';
      box.textContent='Dados do Chefe de Socorro prontos: Ocorrência nº '+(p.numero||'—')+', '+( p.municipio||'município não informado');
      abrirModalNovo();
    }catch(e){ alert('Erro ao ler o arquivo.'); }
  };
  r.readAsText(f); inp.value='';
}

function criarLaudo(){
  var n=document.getElementById('novo-numero').value.trim();
  var c=document.getElementById('novo-certidao').value.trim();
  if(!n||!c){ alert('Preencha o nº do laudo e o nº da certidão.'); return; }

}

function multiCheck(label,field,opts){ var sel=L[field]||[]; return '<label>'+label+'</label><div class="chip-group">'+opts.map(function(o){ return '<button type="button" class="chip'+(sel.indexOf(o)>=0?' ativo':'')+'" onclick="toggleArr(\''+field+'\',\''+esc(o)+'\')">'+o+'</button>'; }).join('')+'</div>'; }
function toggleArr(field,val){ var a=L[field]||[]; if(!Array.isArray(a)) a=[]; var i=a.indexOf(val); if(i>=0) a.splice(i,1); else a.push(val); L[field]=a; autoSalvar(); renderTab(tabAtual); }

function salvarAtual(){
  if(!L) return;
  salvarL(L);

    if(lista[i].id===L.id){ lista[i].status=L.status; lista[i].ts=Date.now(); break; }

  salvarIdx(lista);
}

function capGps(){
  var btn = document.getElementById('btn-gps');
  var status = document.getElementById('gps-status');
  if(!navigator.geolocation){
    if(status) status.innerHTML = '❌ GPS não disponível neste dispositivo ou navegador.';
    return;
  }
  if(btn){ btn.textContent = '⏳ Obtendo localização...'; btn.disabled = true; }
  if(status) status.innerHTML = '<span style="color:#888;">Aguarde, capturando GPS...</span>';
  navigator.geolocation.getCurrentPosition(
    function(pos){
      L.gps = {
        lat: pos.coords.latitude.toFixed(6),
        lng: pos.coords.longitude.toFixed(6),
        precisao: Math.round(pos.coords.accuracy)+'m'
      };
      L.gpsErro = '';
      autoSalvar();
      if(btn){ btn.textContent = '✅ Localização capturada'; btn.disabled = false; }
      if(status) status.innerHTML = '✅ Lat: '+L.gps.lat+' | Lng: '+L.gps.lng+' | Precisão: '+L.gps.precisao;
    },
    function(e){
      var msg = e.code === 1 ? 'Permissão negada. Habilite o GPS nas configurações do navegador.' :
                e.code === 2 ? 'Posição indisponível. Verifique se o GPS está ativo.' :
                e.code === 3 ? 'Tempo esgotado. Tente em local aberto.' : 'Erro: '+e.message;
      L.gpsErro = '❌ '+msg;
      autoSalvar();
      if(btn){ btn.textContent = '📍 Tentar novamente'; btn.disabled = false; }
      if(status) status.innerHTML = '<span style="color:#dc2626;">❌ '+msg+'</span>';
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function setCausa(v){
  L.causa=v;
  L.fundamentacao=gerarFund();
  L.conclusao=gerarConcl();
  L.status=v==='Indeterminada'?'indeterminada':(v?'determinada':'andamento');
  autoSalvar(); atualizarBadge(); renderTab('p4');
}

function regenerarTextos(){
  L.fundamentacao=gerarFund();
  L.conclusao=gerarConcl();
  // Atualiza os campos de texto na tela sem re-renderizar tudo
  var elFund = document.querySelector('#tab-p4 textarea[onchange*="fundamentacao"]');
  var elConcl = document.querySelector('#tab-p5 textarea[onchange*="conclusao"]');
  if(elFund) elFund.value = L.fundamentacao||'';
  if(elConcl) elConcl.value = L.conclusao||'';
  // Atualiza também o campo de fundamentação da aba 4 se estiver visível
  var textareas = document.querySelectorAll('#tab-p4 textarea');
  textareas.forEach(function(ta){
    if(ta.getAttribute('oninput') && ta.getAttribute('oninput').indexOf('fundamentacao')>=0){
      ta.value = L.fundamentacao||'';
    }
  });
}
function gerarFund(){
  if(L.causa==='Indeterminada') return 'Descartadas as hipóteses analisadas e não havendo elementos suficientes e conclusivos para sustentar nenhuma das classificações, conclui-se que o incêndio teve causa indeterminada, subcausa indefinida, evento causal indefinido e agente causal indefinido, pelos seguintes motivos: [explicar].';
  return 'Correlacionando os fatos com os exames realizados e com a análise das hipóteses de exclusão, conclui-se, com segurança, que o incêndio teve causa '+nz(L.causa)+', subcausa '+nz(L.subcausa)+', evento causal '+nz(L.evento)+' e agente causal '+nz(L.agente)+', pelos seguintes motivos: [síntese das evidências].';
}
function gerarConcl(){
  if(L.causa==='Indeterminada') return 'De acordo com a investigação realizada, não foi possível reunir elementos suficientes e conclusivos para determinar, com a segurança técnica exigida, a causa do incêndio, concluindo-se que o sinistro teve causa indeterminada, subcausa indefinida, evento causal indefinido e agente causal indefinido.';
  return 'De acordo com a investigação realizada, conclui-se que o incêndio teve causa '+nz(L.causa)+', subcausa '+nz(L.subcausa)+', evento causal '+nz(L.evento)+' e agente causal '+nz(L.agente)+'.';
}

function buildLaudo(){
  var l=L; var linhas=[];
  function h1(t){ linhas.push('','===== '+t+' =====',''); }
  function h2(t){ linhas.push('--- '+t+' ---',''); }
  function p(t){ linhas.push(t); }
  function br(){ linhas.push(''); }
  p('LAUDO PERICIAL Nº '+nz(l.numero));
  p('Certidão de Ocorrência nº '+nz(l.certidao));
  br();
  h1('PARTE 1 – IDENTIFICAÇÃO');
  h2('1. Dados gerais');
  p('Nº ocorrência: '+nz(l.numOcorrencia)+' | Data: '+nz(l.data)+' | Hora: '+nz(l.hora)+' | OBM: '+nz(l.obm));
  h2('2. Responsáveis');
  p('Perito: '+nz(l.peritoNome)+', '+nz(l.peritoPosto)+', mat. '+nz(l.peritoMat)+', '+nz(l.peritoObm));
  p('Inspetor: '+nz(l.inspNome)+', '+nz(l.inspPosto)+', mat. '+nz(l.inspMat)+', '+nz(l.inspObm));
  h2('3. Imóvel');
  p('RE: '+nz(l.re)+' | Protocolo: '+nz(l.protocolo));
  p('Endereço: '+nz(l.endereco)+(l.bairro?', '+l.bairro:'')+', '+nz(l.cidade)+' - CEP '+nz(l.cep));
  if(l.gps&&l.gps.lat) p('GPS: '+l.gps.lat+', '+l.gps.lng+' ('+l.gps.precisao+')');
  p('Edificação: '+nz(l.nomeEdif)+' | Empresa: '+nz(l.nomeEmpresa)+' | CNPJ: '+nz(l.cnpj));
  h2('4. Características construtivas');
  p('Área: '+nz(l.areaConstruida)+' | Pavimentos: '+nz(l.pavimentos)+' | Blocos: '+nz(l.blocos)+' | Altura: '+nz(l.altura)+' | Ocupação: '+nz(l.ocupacao));
  p('Estrutura: '+(l.estrutura&&l.estrutura.length?l.estrutura.join(', '):'[não informado]'));
  p('Teto: '+(l.teto&&l.teto.length?l.teto.join(', '):'[não informado]'));
  p('Parede: '+(l.parede&&l.parede.length?l.parede.join(', '):'[não informado]'));
  p('Piso: '+(l.piso&&l.piso.length?l.piso.join(', '):'[não informado]'));
  h2('5. Proprietário');
  p(nz(l.propNome)+' | CPF/RG: '+nz(l.propCpf)+' | Tel: '+nz(l.propTel));
  h1('PARTE 2 – FASE PASSIVA (ESTRUTURAL)');
  h2('6.1 Situação da edificação');
  p('PPCI: '+nz(l.ppci)+' | Habite-se: '+nz(l.habitese)+' | Funcionamento: '+nz(l.funcionamento)+' | PRE: '+nz(l.pre));
  h2('6.2 Sistemas preventivos');
  SISTEMAS.forEach(function(s){ var v=l.sistemas[s]||{}; if(v.exigido!==null){ var yn=function(x){ return x===true?'Sim':x===false?'Não':'—'; }; var li=s+': Exigido:'+yn(v.exigido); if(v.exigido){ li+=' | Existente:'+yn(v.existente)+' | Atende:'+yn(v.atende)+' | Falha:'+yn(v.falha); } if(v.obs) li+=' | Obs: '+v.obs; p(li); } });
  if(l.sistObs) p('Obs gerais: '+l.sistObs);
  h2('Considerações – funcionamento');
  p((l.funcAnalise&&l.funcAnalise.txt)||'[não preenchido]');
  h1('PARTE 3 – FASE ATIVA (COMBATE)');
  h2('Dados do combate');
  p('Estratégia: '+nz(l.estrategiaCombate)+' | Técnica: '+nz(l.tecnicaCombate));
  p('Dificuldades: '+nz(l.dificuldades));
  h2('Entrada da guarnição');
  var le=l.localEntrada==='Outro'&&l.localEntradaOutro?'Outro ('+l.localEntradaOutro+')':l.localEntrada;
  p('Local: '+nz(le)+' | Abertura forçada: '+nz(l.forcada)+(l.forcada==='Sim'&&l.forcadaDetalhe?' ('+l.forcadaDetalhe+')':''));
  h2('Análise do combate');
  p((l.analiseCombate&&l.analiseCombate.txt)||'[não preenchido]');
  h1('PARTE 4 – FASE INVESTIGATIVA');
  h2('7. Extensão dos danos');
  p('Área total: '+nz(l.areaTotal)+' | Atingida: '+nz(l.areaAtingida)+' | Salvados: '+nz(l.percSalvados)+' | Perdas: '+nz(l.percPerdas));
  p('Valor salvados: '+nz(l.valorSalvados)+' | Valor perdas: '+nz(l.valorPerdas));
  p('Exames: '+nz(l.exameInicio)+' a '+nz(l.exameFim));
  h2('Vítimas');
  var vits=l.vitimas&&l.vitimas.lista||[];
  if(!vits.length){ p('Sem vítimas registradas.'); }
  else{
    p('Número: '+nz(l.vitimas.quantidade));
    vits.forEach(function(v,i){ var s='Vítima '+(i+1)+': '+nz(v.nome)+', '+nz(v.idade)+' anos, '+nz(v.situacao)+'.'; if(v.lesoes&&v.lesoes.length) s+=' Lesões: '+v.lesoes.map(function(x){ return x.regiao+'–'+x.tipo; }).join('; ')+'.'; if(v.conduzida) s+=' Conduzida: '+v.conduzida+(v.destino?' ('+v.destino+')':'')+'.'; p(s); });
  }
  h2('Seguro incêndio');
  p('Possui: '+nz(l.seguro)+' | Seguradora: '+nz(l.seguradora)+' | Vigência: '+nz(l.segVigencia));
  h2('9.1 Zona de origem'); p((l.zonaOrigem&&l.zonaOrigem.txt)||'[não preenchido]');
  h2('9.2 Foco inicial'); p((l.focoInicial&&l.focoInicial.txt)||'[não preenchido]');
  h2('9.3 Surgimento e propagação'); p((l.propagacao&&l.propagacao.txt)||'[não preenchido]');
  h2('9.4 Exclusão de possibilidades');
  p('HD: '+((l.exclusaoHD&&l.exclusaoHD.txt)||'[não preenchido]')); br();
  p('HI: '+((l.exclusaoHI&&l.exclusaoHI.txt)||'[não preenchido]')); br();
  p('Natural: '+((l.exclusaoNat&&l.exclusaoNat.txt)||'[não preenchido]')); br();
  p('Acidental: '+((l.exclusaoAc&&l.exclusaoAc.txt)||'[não preenchido]'));
  h2('9.5 Exames complementares'); p(l.examesComp||'Não foram necessários.');
  h2('9.6 Causa'); p(l.fundamentacao||'[não preenchido]');
  h1('PARTE 5 – CONCLUSÃO E ANEXOS');
  h2('10. Sugestões'); p(l.sugestoesPreventivas||'Sem sugestões.');
  h2('11. Conclusão'); p(l.conclusao||'[não preenchido]');
  h2('12. Anexos');
  var ff=Object.keys(l.fotosObr||{}).filter(function(k){ return l.fotosObr[k]; });
  if(ff.length) p('Fotos confirmadas: '+ff.join(', '));
  p(l.anexos||'Não informado.');
  return linhas.join('\n');
}

async function copiarLaudo(){
  var txt=buildLaudo();
  try{ await navigator.clipboard.writeText(txt); alert('Copiado!'); }
  catch(e){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('Copiado!'); }
}
function baixarLaudo(){
  var txt=buildLaudo(); var n=(L.numero||'laudo').replace(/[^\w\-]+/g,'_');
  var b=new Blob([txt],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='Laudo_'+n+'.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

var _reHistTemp=[],_reEdifId=null;
function buscarEdifPorRE(){
  var re=document.getElementById('novo-re').value.trim();
  if(!re){alert('Informe o RE.');return;}
  var reN=re.toUpperCase().replace(/\s/g,'');
  var edif=null;
  try{var db=JSON.parse(localStorage.getItem('vistoria_db')||'{}');edif=(db.edificacoes||[]).find(function(e){return(e.numero||'').toUpperCase().replace(/\s/g,'')===reN;});}catch(e){}
  var el=document.getElementById('re-resultado');
  if(!edif){el.style.display='block';el.style.background='#fef2f2';el.style.borderColor='#dc2626';el.innerHTML='❌ Edificação não encontrada no Vistoria para RE: <b>'+re+'</b>';return;}
  _reEdifId=edif.id;
  var anoAtual=new Date().getFullYear();
  var cincoAnos=anoAtual-5;
  var hist=(edif.histVist||[]).filter(function(h){return new Date(h.data).getFullYear()>=cincoAnos;});
  _reHistTemp=hist.slice();
  el.style.display='block';el.style.background='#f0fdf4';el.style.borderColor='#16a34a';
  var fn=document.getElementById('re-nome');if(fn)fn.value=edif.nome||'';
  var fe=document.getElementById('re-endereco');if(fe)fe.value=edif.endereco||'';
  var fm=document.getElementById('re-municipio');if(fm)fm.value=edif.municipio||'';
  var fg=document.getElementById('re-grau');if(fg)fg.value=edif.grauRisco?'Risco '+edif.grauRisco:'';
  var frn=document.getElementById('re-resp-nome');if(frn)frn.value=edif.respNome||'';
  var frt=document.getElementById('re-resp-tel');if(frt)frt.value=edif.respTel||'';
  var fv=document.getElementById('re-venc-func');if(fv)fv.value=edif.vencFunc||'';
  var fp=document.getElementById('re-preventivos');
  if(fp&&edif.preventivos&&edif.preventivos.length){
    fp.innerHTML='<b>Preventivos:</b><br>'+edif.preventivos.map(function(p){
      var vencOk=!p.venc||p.venc>=new Date().toISOString().slice(0,10);
      return (vencOk?'✅ ':'❌ ')+p.sistema+(p.atestado?' — '+p.atestado:'')+(p.venc?' (venc: '+p.venc+')':'');
    }).join('<br>');
  }
  if(edif.projetos&&edif.projetos.length){
    fp.innerHTML+='<br><b>Projetos/Habite-se:</b><br>'+edif.projetos.map(function(p){return '• '+p.tipo+' Nº'+p.numero+(p.data?' — '+p.data:'');}).join('<br>');
  }
  reRenderHist();
  var ap=document.getElementById('novo-apelido');if(ap&&!ap.value)ap.value=edif.nome+(edif.numero?' ('+edif.numero+')':'');
  window._laudoRE=edif.numero||re;window._laudoEdif=edif;
}
function reRenderHist(){
  var el=document.getElementById('re-historico');if(!el)return;
  var icons={aprovado:'✅',reprovado:'❌',parcial:'⚠️'};
  if(!_reHistTemp.length){el.innerHTML='<span style="color:#94a3b8;">Nenhum histórico.</span>';return;}
  el.innerHTML='';
  _reHistTemp.forEach(function(h,i){
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid #e2e8f0;font-size:.77rem;';
    row.innerHTML='<span>'+(icons[h.resultado]||'•')+'</span><span style="font-weight:700;">'+h.data+'</span>'+(h.obs?'<span style="flex:1;color:#64748b;">'+h.obs+'</span>':'<span style="flex:1;"></span>');
    var rm=document.createElement('button');rm.textContent='✕';rm.style.cssText='background:none;border:none;color:#94a3b8;cursor:pointer;';
    rm.addEventListener('click',(function(i2){return function(){_reHistTemp.splice(i2,1);reRenderHist();};})(i));
    row.appendChild(rm);el.appendChild(row);
  });
}
function reAdicionarHist(){
  var data=document.getElementById('re-hv-data').value;if(!data){alert('Informe a data.');return;}
  var res=document.getElementById('re-hv-res').value;
  var obs=document.getElementById('re-hv-obs').value.trim();
  _reHistTemp.unshift({data:data,resultado:res,obs:obs});
  _reHistTemp.sort(function(a,b){return b.data.localeCompare(a.data);});
  document.getElementById('re-hv-data').value='';document.getElementById('re-hv-obs').value='';
  reRenderHist();
}
function reSalvarNoVistoria(){
  if(!_reEdifId){alert('Nenhuma edificação selecionada.');return;}
  try{
    var db=JSON.parse(localStorage.getItem('vistoria_db')||'{}');
    if(!db.edificacoes)db.edificacoes=[];
    var idx=db.edificacoes.findIndex(function(e){return e.id===_reEdifId;});
    if(idx===-1){alert('Edificação não encontrada.');return;}
    var grauVal=(document.getElementById('re-grau').value||'').replace(/\D/g,'');
    db.edificacoes[idx]=Object.assign(db.edificacoes[idx],{
      nome:(document.getElementById('re-nome')||{value:''}).value.trim()||db.edificacoes[idx].nome,
      endereco:(document.getElementById('re-endereco')||{value:''}).value.trim(),
      municipio:(document.getElementById('re-municipio')||{value:''}).value.trim(),
      grauRisco:grauVal||db.edificacoes[idx].grauRisco,
      respNome:(document.getElementById('re-resp-nome')||{value:''}).value.trim(),
      respTel:(document.getElementById('re-resp-tel')||{value:''}).value.trim(),
      vencFunc:(document.getElementById('re-venc-func')||{value:''}).value,
      histVist:_reHistTemp.slice()
    });
    localStorage.setItem('vistoria_db',JSON.stringify(db));
    alert('✅ Dados atualizados no Vistoria!');
  }catch(e){alert('Erro: '+e.message);}
}
function toggleEdifManual(){
  var bl=document.getElementById('edifManualBloco');
  var btn=document.getElementById('btnEdifManual');
  if(!bl)return;
  var aberto=bl.style.display==='block';
  bl.style.display=aberto?'none':'block';
  if(btn)btn.textContent=aberto?'✏️ Dados manuais (sem RE)':'▲ Ocultar dados manuais';
}
var _origAbrirModalNovo=abrirModalNovo;
abrirModalNovo=function(){
  _origAbrirModalNovo();
  ['man-nome','man-endereco','man-municipio','man-grau','man-resp','man-resp-tel','man-obs'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  var bl=document.getElementById('edifManualBloco');if(bl)bl.style.display='none';
  var btn=document.getElementById('btnEdifManual');if(btn)btn.textContent='✏️ Dados manuais (sem RE)';
  var re=document.getElementById('novo-re');if(re)re.value='';
  var res=document.getElementById('re-resultado');if(res)res.style.display='none';
  _reEdifId=null;_reHistTemp=[];window._laudoRE=null;window._laudoEdif=null;
};
var _origCriarLaudo=criarLaudo;
criarLaudo=function(){
  var bl=document.getElementById('edifManualBloco');
  if(bl&&bl.style.display==='block'){
    var nome=(document.getElementById('man-nome')||{value:''}).value.trim();
    if(nome){window._laudoEdif=window._laudoEdif||{};Object.assign(window._laudoEdif,{nome:nome,endereco:(document.getElementById('man-endereco')||{value:''}).value,municipio:(document.getElementById('man-municipio')||{value:''}).value,grauRisco:(document.getElementById('man-grau')||{value:''}).value,respNome:(document.getElementById('man-resp')||{value:''}).value,respTel:(document.getElementById('man-resp-tel')||{value:''}).value,obs:(document.getElementById('man-obs')||{value:''}).value,semRE:true});}
  }
  _origCriarLaudo();
  if(window._laudoRE&&window._laudoEdif){try{var laudos=carregarIdx();if(laudos.length){laudos[laudos.length-1].reEdif=window._laudoRE;laudos[laudos.length-1].dadosEdif=window._laudoEdif;salvarIdx(laudos);}}catch(e){}window._laudoRE=null;window._laudoEdif=null;}
};

</script>

<!-- PÁGINA PONTOS DE INTERESSE -->
<div id="pg-pontos" class="page" style="display:none;">
  <div class="header">
    <div><h1>Pontos de Interesse</h1><h2>CBMSC — Campo</h2></div>
    <button class="btn btn-outline btn-sm" onclick="irLista()">← Voltar</button>
  </div>
  <div style="padding:12px;">
    <!-- MAPA -->
    <div id="mapPOI-p"></div>
    <!-- CAMADAS -->
    <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" id="tileRuaP" onclick="setTileP('rua')">🏙️ Ruas</button>
      <button class="btn btn-outline btn-sm" id="tileSatP" onclick="setTileP('satelite')">🛰️ Satélite</button>
      <button class="btn btn-outline btn-sm" id="tileRelevoP" onclick="setTileP('relevo')">🏔️ Relevo</button>
    </div>
    <button class="btn btn-primary" onclick="marcarPOIP()" style="margin-bottom:12px;width:100%;">📍 Marcar Ponto Aqui</button>

    <div id="listaPOI-p"></div>
  </div>
</div>

<!-- MODAL NOVO PONTO PERITO -->
<div id="mo-poi-p" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:flex-end;">
  <div style="background:#fff;border-radius:16px 16px 0 0;padding:18px 14px 38px;width:100%;max-height:92vh;overflow-y:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <span id="mo-poi-p-titulo" style="font-size:17px;font-weight:700;">📍 Novo Ponto</span>
      <button onclick="fecharMoPOIP()" style="background:#f2f2f7;border:none;width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:11px;font-weight:700;color:#6c6c70;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px;">Categoria</label>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;" id="catGridPOI-p"></div>
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:11px;font-weight:700;color:#6c6c70;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;">Nome / Descrição</label>
      <input type="text" id="poi-p-nome" placeholder="Ex: Hidrante Rua das Flores…" style="width:100%;padding:11px 13px;border:1.5px solid #e5e5ea;border-radius:10px;font-size:15px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:11px;font-weight:700;color:#6c6c70;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;">Observações</label>
      <textarea id="poi-p-obs" placeholder="Informações adicionais…" style="width:100%;padding:11px 13px;border:1.5px solid #e5e5ea;border-radius:10px;font-size:14px;font-family:inherit;resize:vertical;min-height:60px;box-sizing:border-box;"></textarea>
    </div>
    <div style="background:#f2f2f7;border-radius:8px;padding:10px;margin-bottom:14px;">
      <div style="font-size:11px;font-weight:700;color:#6c6c70;margin-bottom:6px;">COORDENADAS</div>
      <div id="poi-p-gps-label" style="font-size:12px;color:#6c6c70;margin-bottom:6px;">Sem GPS</div>
      <div style="display:flex;gap:6px;margin-bottom:6px;">
        <input type="number" id="poi-p-lat" placeholder="Latitude" step="0.00001" style="flex:1;padding:9px;border:1.5px solid #e5e5ea;border-radius:8px;font-size:13px;">
        <input type="number" id="poi-p-lng" placeholder="Longitude" step="0.00001" style="flex:1;padding:9px;border:1.5px solid #e5e5ea;border-radius:8px;font-size:13px;">
      </div>
      <button onclick="usarGpsPOIP()" style="background:#fff;border:1px solid #e5e5ea;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;">📡 Usar GPS agora</button>
    </div>
    <button onclick="salvarPOIP()" style="width:100%;background:#7c3aed;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;">Salvar Ponto ✓</button>
  </div>
</div>
