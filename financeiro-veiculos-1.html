<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Financeiro & Veículos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23134e4a'/%3E%3Cpath d='M20 60 L28 40 Q30 36 35 36 L65 36 Q70 36 72 40 L80 60' stroke='%23fbbf24' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Crect x='16' y='58' width='68' height='16' rx='6' fill='%23fbbf24'/%3E%3Ccircle cx='30' cy='78' r='7' fill='%23134e4a'/%3E%3Ccircle cx='70' cy='78' r='7' fill='%23134e4a'/%3E%3Crect x='42' y='20' width='16' height='12' rx='2' fill='%2334d399'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273548;--accent:#34d399;--accent2:#fbbf24;--danger:#f87171;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px;font-size:15px}
header{background:linear-gradient(135deg,#134e4a,#0f172a);padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
header svg{width:32px;height:32px}
header h1{font-size:17px;font-weight:600}
header .sub{font-size:11px;color:var(--muted)}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.card h2{font-size:14px;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.big{font-size:22px;font-weight:700}
.muted{color:var(--muted);font-size:12px}
.bar-bg{background:var(--card2);border-radius:8px;height:10px;overflow:hidden;margin:8px 0}
.bar-fill{height:100%;background:var(--accent);transition:width .3s}
.bar-fill.warn{background:var(--accent2)}
.bar-fill.over{background:var(--danger)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:15px;margin-bottom:8px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
button{background:var(--accent);color:#0f172a;border:none;padding:10px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
button.danger{background:var(--danger);color:#1a0505}
button.small{padding:6px 10px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list-item{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-item .info{flex:1;min-width:0}
.list-item .info b{display:block;font-size:14px}
.list-item .info span{font-size:12px;color:var(--muted)}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--card);border:1px solid var(--border);white-space:nowrap}
.tag.auto{background:#1e3a3a;color:var(--accent);border-color:var(--accent)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20}
nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 2px;font-size:11px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{color:var(--accent)}
nav button svg{width:20px;height:20px}
.hidden{display:none !important}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{background:var(--card2);color:var(--muted);white-space:nowrap;font-size:12px;padding:7px 12px}
.tabs button.active{background:var(--accent);color:#0f172a}
.alert-banner{background:#3a2410;border:1px solid var(--accent2);color:var(--accent2);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
.alert-banner.danger{background:#3a1414;border-color:var(--danger);color:var(--danger)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:50}
.modal{background:var(--card);width:100%;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px}
.modal h3{margin-bottom:10px}
.close-x{float:right;background:none;color:var(--muted);font-size:20px;padding:0 6px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13px}
.category-color{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
</style>
</head>
<body>

<header>
<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#134e4a"/><path d="M20 60 L28 40 Q30 36 35 36 L65 36 Q70 36 72 40 L80 60" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="16" y="58" width="68" height="16" rx="6" fill="#fbbf24"/><circle cx="30" cy="78" r="7" fill="#134e4a"/><circle cx="70" cy="78" r="7" fill="#134e4a"/><rect x="42" y="20" width="16" height="12" rx="2" fill="#34d399"/></svg>
<div><h1>Financeiro & Veículos</h1><div class="sub" id="headerSub">carregando...</div></div>
</header>

<main id="app"></main>

<nav>
<button id="navDash" onclick="setScreen('dash')">📊<span>Painel</span></button>
<button id="navFin" onclick="setScreen('fin')">💰<span>Financeiro</span></button>
<button id="navVei" onclick="setScreen('vei')">🚗<span>Veículos</span></button>
<button id="navComp" onclick="setScreen('comp')">📅<span>Comparar</span></button>
<button id="navCfg" onclick="setScreen('cfg')">⚙️<span>Config</span></button>
</nav>

<div id="modalRoot"></div>

<script>
/* ====================== DATA LAYER ====================== */
const STORAGE_KEY = 'fv_data_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);

const DEFAULT_CATEGORIES = [
  {id:'combustivel', nome:'Combustível', cor:'#fbbf24', veiculo:true},
  {id:'manutencao', nome:'Manutenção', cor:'#f87171', veiculo:true},
  {id:'ipva', nome:'IPVA', cor:'#a78bfa', veiculo:true},
  {id:'seguro', nome:'Seguro Veículo', cor:'#60a5fa', veiculo:true},
  {id:'vistoria', nome:'Vistoria', cor:'#22d3ee', veiculo:true},
  {id:'moradia', nome:'Moradia', cor:'#34d399', veiculo:false},
  {id:'alimentacao', nome:'Alimentação', cor:'#fb923c', veiculo:false},
  {id:'saude', nome:'Saúde', cor:'#f472b6', veiculo:false},
  {id:'lazer', nome:'Lazer', cor:'#818cf8', veiculo:false},
  {id:'educacao', nome:'Educação', cor:'#38bdf8', veiculo:false},
  {id:'outros', nome:'Outros', cor:'#94a3b8', veiculo:false},
  {id:'receita', nome:'Receita', cor:'#34d399', veiculo:false}
];

function defaultData(){
  return {
    config:{
      weekStartDay: 1, // 0=domingo ... 1=segunda
      weeklyBudget: 0,
      monthlyBudget: 0,
      alertPercent: 80,
      rolloverWeekly: true
    },
    categories: DEFAULT_CATEGORIES,
    vehicles: [],
    drivers: [],
    transactions: []
  };
}

let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultData(), parsed, {
      config: Object.assign(defaultData().config, parsed.config||{}),
      categories: parsed.categories && parsed.categories.length ? parsed.categories : DEFAULT_CATEGORIES
    });
  }catch(e){
    console.error('Erro ao carregar dados, iniciando vazio.', e);
    return defaultData();
  }
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  renderHeaderSub();
}

/* ====================== DATE / WEEK HELPERS ====================== */
function parseDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(iso){ const d=parseDate(iso); return d.toLocaleDateString('pt-BR'); }
function fmtMoney(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

// Retorna {start:Date, end:Date} da semana que contém 'date', respeitando weekStartDay
function weekRange(date){
  const start = new Date(date);
  const wsd = DB.config.weekStartDay;
  let diff = (start.getDay() - wsd + 7) % 7;
  start.setDate(start.getDate() - diff);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  end.setHours(23,59,59,999);
  return {start,end};
}
function isoOf(d){ return d.toISOString().slice(0,10); }
function weekLabel(range){
  const sameMonth = range.start.getMonth()===range.end.getMonth();
  const opts = sameMonth ? {day:'2-digit'} : {day:'2-digit', month:'2-digit'};
  const s = range.start.toLocaleDateString('pt-BR', opts);
  const e = range.end.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
  return `${s} – ${e}`;
}
function monthKey(iso){ return iso.slice(0,7); } // YYYY-MM
function monthLabel(key){
  const [y,m]=key.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
}

/* Soma transações de despesa dentro de um intervalo de datas (ISO strings, inclusive) */
function sumInRange(startISO, endISO, filterFn){
  return DB.transactions
    .filter(t => t.date>=startISO && t.date<=endISO && t.tipo==='gasto' && (!filterFn || filterFn(t)))
    .reduce((s,t)=>s+Number(t.valor),0);
}
function sumReceitaInRange(startISO, endISO){
  return DB.transactions
    .filter(t => t.date>=startISO && t.date<=endISO && t.tipo==='receita')
    .reduce((s,t)=>s+Number(t.valor),0);
}

/* Calcula orçamento semanal com rollover: soma o saldo (orçamento - gasto) de todas as semanas
   anteriores até a semana atual, se rollover ativado. Caso contrário, usa só a semana atual. */
function weeklyBudgetStatus(refDate){
  const cfg = DB.config;
  const range = weekRange(refDate);
  const gastoSemana = sumInRange(isoOf(range.start), isoOf(range.end));
  let saldoDisponivel = cfg.weeklyBudget - gastoSemana;

  if(cfg.rolloverWeekly && cfg.weeklyBudget>0){
    // acumula saldo das semanas anteriores desde o primeiro lançamento registrado
    const firstTxDate = DB.transactions.length ? DB.transactions.reduce((min,t)=> t.date<min?t.date:min, DB.transactions[0].date) : isoOf(range.start);
    let cursor = weekRange(parseDate(firstTxDate)).start;
    let rollover = 0;
    while(cursor < range.start){
      const r = weekRange(cursor);
      const gasto = sumInRange(isoOf(r.start), isoOf(r.end));
      rollover += (cfg.weeklyBudget - gasto);
      cursor = new Date(r.end); cursor.setDate(cursor.getDate()+1);
    }
    saldoDisponivel = cfg.weeklyBudget - gastoSemana + rollover;
    return {gasto:gastoSemana, orcamento:cfg.weeklyBudget, saldo:saldoDisponivel, rollover, range};
  }
  return {gasto:gastoSemana, orcamento:cfg.weeklyBudget, saldo:saldoDisponivel, rollover:0, range};
}

function monthlyBudgetStatus(refDate){
  const key = monthKey(isoOf(refDate));
  const start = key+'-01';
  const endD = new Date(refDate.getFullYear(), refDate.getMonth()+1, 0);
  const end = isoOf(endD);
  const gasto = sumInRange(start,end);
  return {gasto, orcamento: DB.config.monthlyBudget, saldo: DB.config.monthlyBudget - gasto, key, start, end};
}

/* ====================== SCREEN STATE ====================== */
let currentScreen = 'dash';
function setScreen(s){
  currentScreen = s;
  ['navDash','navFin','navVei','navComp','navCfg'].forEach(id=>document.getElementById(id).classList.remove('active'));
  const map = {dash:'navDash', fin:'navFin', vei:'navVei', comp:'navComp', cfg:'navCfg'};
  document.getElementById(map[s]).classList.add('active');
  render();
}

function renderHeaderSub(){
  const el = document.getElementById('headerSub');
  if(!el) return;
  el.textContent = `${DB.transactions.length} lançamentos · ${DB.vehicles.length} veículo(s)`;
}

/* ====================== RENDER ROUTER ====================== */
function render(){
  const app = document.getElementById('app');
  if(currentScreen==='dash') app.innerHTML = renderDash();
  else if(currentScreen==='fin') app.innerHTML = renderFin();
  else if(currentScreen==='vei') app.innerHTML = renderVei();
  else if(currentScreen==='comp') app.innerHTML = renderComp();
  else if(currentScreen==='cfg') app.innerHTML = renderCfg();
  renderHeaderSub();
}

/* ====================== DASHBOARD ====================== */
function renderDash(){
  const now = new Date();
  const w = weeklyBudgetStatus(now);
  const m = monthlyBudgetStatus(now);
  const wPct = w.orcamento>0 ? Math.min(100, Math.round((w.gasto/w.orcamento)*100)) : 0;
  const mPct = m.orcamento>0 ? Math.min(100, Math.round((m.gasto/m.orcamento)*100)) : 0;
  const alertP = DB.config.alertPercent;

  let banners = '';
  if(w.orcamento>0 && (w.gasto/w.orcamento*100)>=100) banners += `<div class="alert-banner danger">⚠️ Orçamento semanal estourado em ${fmtMoney(w.gasto-w.orcamento)}.</div>`;
  else if(w.orcamento>0 && (w.gasto/w.orcamento*100)>=alertP) banners += `<div class="alert-banner">⚠️ Você já usou ${wPct}% do orçamento semanal.</div>`;
  if(m.orcamento>0 && (m.gasto/m.orcamento*100)>=100) banners += `<div class="alert-banner danger">⚠️ Orçamento mensal estourado em ${fmtMoney(m.gasto-m.orcamento)}.</div>`;
  else if(m.orcamento>0 && (m.gasto/m.orcamento*100)>=alertP) banners += `<div class="alert-banner">⚠️ Você já usou ${mPct}% do orçamento mensal.</div>`;

  const recentes = [...DB.transactions].sort((a,b)=>b.date.localeCompare(a.date) || b.criadoEm-a.criadoEm).slice(0,6);

  return `
  ${banners}
  <div class="card">
    <h2>Semana atual (${weekLabel(w.range)})</h2>
    <div class="row"><span class="muted">Gasto</span><b>${fmtMoney(w.gasto)}</b></div>
    <div class="row"><span class="muted">Orçamento</span><b>${fmtMoney(w.orcamento)}</b></div>
    ${DB.config.rolloverWeekly ? `<div class="row"><span class="muted">Saldo acumulado (c/ rollover)</span><b style="color:${w.saldo<0?'var(--danger)':'var(--accent)'}">${fmtMoney(w.saldo)}</b></div>`:''}
    <div class="bar-bg"><div class="bar-fill ${wPct>=100?'over':wPct>=alertP?'warn':''}" style="width:${wPct}%"></div></div>
  </div>
  <div class="card">
    <h2>Mês atual (${monthLabel(m.key)})</h2>
    <div class="row"><span class="muted">Gasto</span><b>${fmtMoney(m.gasto)}</b></div>
    <div class="row"><span class="muted">Orçamento</span><b>${fmtMoney(m.orcamento)}</b></div>
    <div class="row"><span class="muted">Saldo</span><b style="color:${m.saldo<0?'var(--danger)':'var(--accent)'}">${fmtMoney(m.saldo)}</b></div>
    <div class="bar-bg"><div class="bar-fill ${mPct>=100?'over':mPct>=alertP?'warn':''}" style="width:${mPct}%"></div></div>
  </div>
  <div class="card">
    <h2>Últimos lançamentos</h2>
    ${recentes.length ? recentes.map(txItem).join('') : '<div class="empty">Nenhum lançamento ainda.</div>'}
  </div>
  <div class="grid2">
    <button onclick="openTxModal()">+ Lançamento</button>
    <button class="secondary" onclick="setScreen('vei')">+ Gasto de veículo</button>
  </div>
  `;
}

function txItem(t){
  const cat = DB.categories.find(c=>c.id===t.categoria) || {nome:t.categoria, cor:'#94a3b8'};
  const sign = t.tipo==='receita' ? '+' : '−';
  const color = t.tipo==='receita' ? 'var(--accent)' : 'var(--text)';
  return `<div class="list-item">
    <div class="info">
      <b><span class="category-color" style="background:${cat.cor}"></span>${t.descricao||cat.nome}</b>
      <span>${fmtDate(t.date)} · ${cat.nome}${t.origem==='veiculo'?' · veículo':''}</span>
    </div>
    <div style="text-align:right">
      <div style="color:${color};font-weight:700">${sign} ${fmtMoney(t.valor)}</div>
      ${t.origem==='veiculo' ? '<span class="tag auto">auto</span>' : `<button class="small secondary" onclick="deleteTx('${t.id}')">excluir</button>`}
    </div>
  </div>`;
}

function deleteTx(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(t && t.origem==='veiculo'){ alert('Este lançamento veio de um gasto de veículo. Exclua-o na aba Veículos.'); return; }
  if(!confirm('Excluir este lançamento?')) return;
  DB.transactions = DB.transactions.filter(x=>x.id!==id);
  save(); render();
}

/* ====================== FINANCEIRO (extrato + lançamento manual) ====================== */
let finFilterMonth = monthKey(todayISO());
function renderFin(){
  const months = [...new Set(DB.transactions.map(t=>monthKey(t.date)))].sort().reverse();
  if(!months.includes(finFilterMonth)) months.unshift(finFilterMonth);
  const list = DB.transactions.filter(t=>monthKey(t.date)===finFilterMonth).sort((a,b)=>b.date.localeCompare(a.date));
  const totalGasto = list.filter(t=>t.tipo==='gasto').reduce((s,t)=>s+Number(t.valor),0);
  const totalReceita = list.filter(t=>t.tipo==='receita').reduce((s,t)=>s+Number(t.valor),0);

  return `
  <div class="card">
    <h2>Extrato</h2>
    <select onchange="finFilterMonth=this.value;render()">
      ${months.map(k=>`<option value="${k}" ${k===finFilterMonth?'selected':''}>${monthLabel(k)}</option>`).join('')}
    </select>
    <div class="row"><span class="muted">Receitas</span><b style="color:var(--accent)">${fmtMoney(totalReceita)}</b></div>
    <div class="row"><span class="muted">Gastos</span><b>${fmtMoney(totalGasto)}</b></div>
    <div class="row"><span class="muted">Saldo do mês</span><b>${fmtMoney(totalReceita-totalGasto)}</b></div>
  </div>
  <div class="card">
    <h2>Lançamentos (${list.length})</h2>
    ${list.length ? list.map(txItem).join('') : '<div class="empty">Nenhum lançamento neste mês.</div>'}
  </div>
  <button onclick="openTxModal()">+ Novo lançamento</button>
  `;
}

function openTxModal(){
  const cats = DB.categories.filter(c=>!c.veiculo);
  const html = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>Novo lançamento</h3>
      <label>Tipo</label>
      <select id="txTipo"><option value="gasto">Gasto</option><option value="receita">Receita</option></select>
      <label>Descrição</label>
      <input id="txDesc" placeholder="Ex: Mercado, salário...">
      <label>Categoria</label>
      <select id="txCat">${cats.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select>
      <label>Valor (R$)</label>
      <input id="txValor" type="number" step="0.01" placeholder="0,00">
      <label>Data</label>
      <input id="txData" type="date" value="${todayISO()}">
      <button onclick="saveTxManual()">Salvar</button>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function saveTxManual(){
  const valor = parseFloat(document.getElementById('txValor').value);
  if(!valor || valor<=0){ alert('Informe um valor válido.'); return; }
  DB.transactions.push({
    id: uid(),
    date: document.getElementById('txData').value || todayISO(),
    descricao: document.getElementById('txDesc').value.trim(),
    categoria: document.getElementById('txCat').value,
    valor,
    tipo: document.getElementById('txTipo').value,
    origem: 'manual',
    criadoEm: Date.now()
  });
  save(); closeModal(); render();
}

/* ====================== VEÍCULOS ====================== */
let veiTab = 'gastos';
function renderVei(){
  return `
  <div class="tabs">
    <button class="${veiTab==='gastos'?'active':''}" onclick="veiTab='gastos';render()">Gastos</button>
    <button class="${veiTab==='veiculos'?'active':''}" onclick="veiTab='veiculos';render()">Veículos</button>
    <button class="${veiTab==='motoristas'?'active':''}" onclick="veiTab='motoristas';render()">Motoristas</button>
  </div>
  ${veiTab==='gastos'?renderVeiGastos():veiTab==='veiculos'?renderVeiVeiculos():renderVeiMotoristas()}
  `;
}

function renderVeiGastos(){
  const list = DB.transactions.filter(t=>t.origem==='veiculo').sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="card">
    <h2>Gastos com veículos</h2>
    ${!DB.vehicles.length ? '<div class="empty">Cadastre um veículo primeiro na aba "Veículos".</div>' : list.length ? list.map(t=>{
      const v = DB.vehicles.find(v=>v.id===t.veiculoId);
      const cat = DB.categories.find(c=>c.id===t.categoria)||{nome:t.categoria,cor:'#94a3b8'};
      return `<div class="list-item">
        <div class="info"><b><span class="category-color" style="background:${cat.cor}"></span>${cat.nome} — ${v?v.nome:'?'}</b><span>${fmtDate(t.date)} · ${t.descricao||''}</span></div>
        <div style="text-align:right"><div style="font-weight:700">${fmtMoney(t.valor)}</div><button class="small secondary" onclick="deleteVeiGasto('${t.id}')">excluir</button></div>
      </div>`;
    }).join('') : '<div class="empty">Nenhum gasto registrado.</div>'}
  </div>
  ${DB.vehicles.length ? '<button onclick="openVeiGastoModal()">+ Registrar gasto de veículo</button>' : ''}
  `;
}

function deleteVeiGasto(id){
  if(!confirm('Excluir este gasto de veículo? Ele será removido também do Financeiro.')) return;
  DB.transactions = DB.transactions.filter(t=>t.id!==id);
  save(); render();
}

function openVeiGastoModal(){
  const catsVei = DB.categories.filter(c=>c.veiculo);
  const html = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>Gasto de veículo</h3>
      <label>Veículo</label>
      <select id="vgVeiculo">${DB.vehicles.map(v=>`<option value="${v.id}">${v.nome}</option>`).join('')}</select>
      <label>Tipo de gasto</label>
      <select id="vgCat">${catsVei.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}</select>
      <label>Descrição (opcional)</label>
      <input id="vgDesc" placeholder="Ex: Posto Shell, troca de óleo...">
      <label>Valor (R$)</label>
      <input id="vgValor" type="number" step="0.01">
      <label>Data</label>
      <input id="vgData" type="date" value="${todayISO()}">
      <p class="muted" style="margin:6px 0 10px">Este gasto será lançado automaticamente no Financeiro.</p>
      <button onclick="saveVeiGasto()">Salvar</button>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
}

function saveVeiGasto(){
  const valor = parseFloat(document.getElementById('vgValor').value);
  if(!valor || valor<=0){ alert('Informe um valor válido.'); return; }
  DB.transactions.push({
    id: uid(),
    date: document.getElementById('vgData').value || todayISO(),
    descricao: document.getElementById('vgDesc').value.trim(),
    categoria: document.getElementById('vgCat').value,
    valor,
    tipo: 'gasto',
    origem: 'veiculo',
    veiculoId: document.getElementById('vgVeiculo').value,
    criadoEm: Date.now()
  });
  save(); closeModal(); render();
}

function renderVeiVeiculos(){
  return `
  <div class="card">
    <h2>Meus veículos</h2>
    ${DB.vehicles.length ? DB.vehicles.map(v=>{
      const gastoTotal = DB.transactions.filter(t=>t.veiculoId===v.id).reduce((s,t)=>s+Number(t.valor),0);
      return `<div class="list-item">
        <div class="info"><b>${v.nome}</b><span>${v.placa||'sem placa'} · gasto total: ${fmtMoney(gastoTotal)}</span></div>
        <button class="small secondary" onclick="deleteVehicle('${v.id}')">excluir</button>
      </div>`;
    }).join('') : '<div class="empty">Nenhum veículo cadastrado.</div>'}
  </div>
  <button onclick="openVehicleModal()">+ Novo veículo</button>
  `;
}
function openVehicleModal(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>Novo veículo</h3>
      <label>Nome / apelido</label><input id="vName" placeholder="Ex: Corolla, Moto...">
      <label>Placa</label><input id="vPlaca" placeholder="ABC1D23">
      <button onclick="saveVehicle()">Salvar</button>
    </div>
  </div>`;
}
function saveVehicle(){
  const nome = document.getElementById('vName').value.trim();
  if(!nome){ alert('Informe um nome.'); return; }
  DB.vehicles.push({id:uid(), nome, placa:document.getElementById('vPlaca').value.trim()});
  save(); closeModal(); render();
}
function deleteVehicle(id){
  if(!confirm('Excluir veículo? Os gastos já lançados permanecem no histórico.')) return;
  DB.vehicles = DB.vehicles.filter(v=>v.id!==id);
  save(); render();
}

function renderVeiMotoristas(){
  return `
  <div class="card">
    <h2>Motoristas</h2>
    ${DB.drivers.length ? DB.drivers.map(d=>`<div class="list-item">
      <div class="info"><b>${d.nome}</b><span>CNH vence: ${d.cnhVenc?fmtDate(d.cnhVenc):'não informado'}</span></div>
      <button class="small secondary" onclick="deleteDriver('${d.id}')">excluir</button>
    </div>`).join('') : '<div class="empty">Nenhum motorista cadastrado.</div>'}
  </div>
  <button onclick="openDriverModal()">+ Novo motorista</button>
  `;
}
function openDriverModal(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="close-x" onclick="closeModal()">✕</button>
      <h3>Novo motorista</h3>

      <label>Validade da CNH</label><input id="dCnh" type="date">
      <button onclick="saveDriver()">Salvar</button>
    </div>
  </div>`;
}
function saveDriver(){
  const nome = document.getElementById('dName').value.trim();
  if(!nome){ alert('Informe um nome.'); return; }
  DB.drivers.push({id:uid(), nome, cnhVenc:document.getElementById('dCnh').value});
  save(); closeModal(); render();
}
function deleteDriver(id){
  if(!confirm('Excluir motorista?')) return;
  DB.drivers = DB.drivers.filter(d=>d.id!==id);
  save(); render();
}

/* ====================== COMPARATIVO ====================== */
function renderComp(){
  const months = [...new Set(DB.transactions.map(t=>monthKey(t.date)))].sort().reverse();
  if(months.length<1) return '<div class="card"><div class="empty">Sem dados suficientes para comparar ainda.</div></div>';
  const a = months[0], b = months[1]||months[0];
  return `
  <div class="card">
    <h2>Comparar meses</h2>
    <div class="grid2">
      <div><label>Mês A</label><select id="compA" onchange="render()">${months.map(k=>`<option value="${k}" ${k===a?'selected':''}>${monthLabel(k)}</option>`).join('')}</select></div>
      <div><label>Mês B</label><select id="compB" onchange="render()">${months.map(k=>`<option value="${k}" ${k===b?'selected':''}>${monthLabel(k)}</option>`).join('')}</select></div>
    </div>
    ${renderCompTable(document.getElementById('compA')?document.getElementById('compA').value:a, document.getElementById('compB')?document.getElementById('compB').value:b)}
  </div>`;
}
function renderCompTable(a,b){
  const byCat = (key)=>{
    const map = {};
    DB.transactions.filter(t=>monthKey(t.date)===key && t.tipo==='gasto').forEach(t=>{
      map[t.categoria] = (map[t.categoria]||0) + Number(t.valor);
    });
    return map;
  };
  const ca = byCat(a), cb = byCat(b);
  const allCats = [...new Set([...Object.keys(ca), ...Object.keys(cb)])];
  const totalA = Object.values(ca).reduce((s,v)=>s+v,0);
  const totalB = Object.values(cb).reduce((s,v)=>s+v,0);
  return `
  <div style="margin-top:10px">
    ${allCats.map(id=>{
      const cat = DB.categories.find(c=>c.id===id)||{nome:id,cor:'#94a3b8'};
      return `<div class="row"><span><span class="category-color" style="background:${cat.cor}"></span>${cat.nome}</span><span>${fmtMoney(ca[id]||0)} vs ${fmtMoney(cb[id]||0)}</span></div>`;
    }).join('') || '<div class="empty">Sem gastos nesses meses.</div>'}
    <div class="row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:6px"><b>Total</b><b>${fmtMoney(totalA)} vs ${fmtMoney(totalB)}</b></div>
  </div>`;
}

/* ====================== CONFIG / BACKUP ====================== */
function renderCfg(){
  const c = DB.config;
  return `
  <div class="card">
    <h2>Orçamentos</h2>
    <label>Orçamento semanal (R$)</label>
    <input id="cfgWeekly" type="number" step="0.01" value="${c.weeklyBudget}">
    <label>Orçamento mensal (R$)</label>
    <input id="cfgMonthly" type="number" step="0.01" value="${c.monthlyBudget}">
    <label>Dia de início da semana</label>
    <select id="cfgWeekStart">
      ${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((d,i)=>`<option value="${i}" ${i===c.weekStartDay?'selected':''}>${d}</option>`).join('')}
    </select>
    <label>Alertar quando gasto atingir (%)</label>
    <input id="cfgAlert" type="number" value="${c.alertPercent}">
    <label style="display:flex;align-items:center;gap:8px;margin-top:4px">
      <input type="checkbox" id="cfgRollover" style="width:auto" ${c.rolloverWeekly?'checked':''}> Acumular saldo semanal não usado (rollover)
    </label>
    <button onclick="saveConfig()">Salvar configurações</button>
  </div>

  <div class="card">
    <h2>Backup</h2>
    <p class="muted" style="margin-bottom:10px">Exporte regularmente e guarde no WhatsApp (mensagem para si mesmo) e no Google Drive, como de costume.</p>
    <div class="grid2">
      <button onclick="exportBackup()">Exportar JSON</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">Importar JSON</button>
    </div>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
  </div>

  <div class="card">
    <h2>Zona de risco</h2>
    <button class="danger" onclick="wipeAll()">Apagar todos os dados</button>
  </div>
  `;
}
function saveConfig(){
  DB.config.weeklyBudget = parseFloat(document.getElementById('cfgWeekly').value)||0;
  DB.config.monthlyBudget = parseFloat(document.getElementById('cfgMonthly').value)||0;
  DB.config.weekStartDay = parseInt(document.getElementById('cfgWeekStart').value);
  DB.config.alertPercent = parseFloat(document.getElementById('cfgAlert').value)||80;
  DB.config.rolloverWeekly = document.getElementById('cfgRollover').checked;
  save();
  alert('Configurações salvas.');
  render();
}

function exportBackup(){
  const payload = {...DB, exportadoEm: new Date().toISOString(), app:'financeiro-veiculos', versao:1};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `financeiro-veiculos-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const incoming = JSON.parse(e.target.result);
      const mode = confirm('OK = Mesclar com os dados atuais\nCancelar = Substituir tudo pelos dados importados') ? 'merge' : 'replace';
      if(mode==='replace'){
        DB = Object.assign(defaultData(), incoming);
      } else {
        const existingIds = new Set(DB.transactions.map(t=>t.id));
        (incoming.transactions||[]).forEach(t=>{ if(!existingIds.has(t.id)) DB.transactions.push(t); });
        const existingVeh = new Set(DB.vehicles.map(v=>v.id));
        (incoming.vehicles||[]).forEach(v=>{ if(!existingVeh.has(v.id)) DB.vehicles.push(v); });
        const existingDrv = new Set(DB.drivers.map(d=>d.id));
        (incoming.drivers||[]).forEach(d=>{ if(!existingDrv.has(d.id)) DB.drivers.push(d); });
      }
      save(); render();
      alert('Backup importado com sucesso.');
    }catch(err){
      alert('Arquivo inválido: '+err.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function wipeAll(){
  if(!confirm('Isso vai apagar TODOS os dados deste aplicativo neste dispositivo. Tem certeza?')) return;
  if(!confirm('Confirme novamente: apagar tudo?')) return;
  DB = defaultData();
  save(); render();
}

/* ====================== PWA (manifest + service worker inline) ====================== */
const ICON_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23134e4a'/%3E%3Cpath d='M20 60 L28 40 Q30 36 35 36 L65 36 Q70 36 72 40 L80 60' stroke='%23fbbf24' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Crect x='16' y='58' width='68' height='16' rx='6' fill='%23fbbf24'/%3E%3Ccircle cx='30' cy='78' r='7' fill='%23134e4a'/%3E%3Ccircle cx='70' cy='78' r='7' fill='%23134e4a'/%3E%3Crect x='42' y='20' width='16' height='12' rx='2' fill='%2334d399'/%3E%3C/svg%3E";

function setupPWA(){
  try{
    const manifest = {
      name: "Financeiro & Veículos",
      short_name: "Fin+Veic",
      start_url: ".",
      scope: ".",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#134e4a",
      icons: [
        {src: ICON_SVG, sizes:"192x192", type:"image/svg+xml", purpose:"any maskable"},
        {src: ICON_SVG, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    // Service worker só é aceito pelo navegador em contexto https ou localhost — não funciona abrindo o arquivo direto (file://).
    if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
      const swCode = `
        const CACHE='fv-cache-v1';
        self.addEventListener('install', e=>{ self.skipWaiting(); });
        self.addEventListener('activate', e=>{ self.clients.claim(); });
        self.addEventListener('fetch', e=>{
          e.respondWith(
            caches.open(CACHE).then(cache=>
              fetch(e.request).then(res=>{ cache.put(e.request, res.clone()); return res; })
                .catch(()=> cache.match(e.request))
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err=>console.warn('SW não registrado:', err));
    }
  }catch(e){ console.warn('PWA setup falhou:', e); }
}

/* ====================== INIT ====================== */
try{
  render();
  setupPWA();
}catch(e){
  document.getElementById('app').innerHTML = '<div class="card"><h2>Erro ao iniciar</h2><p>'+e.message+'</p></div>';
  console.error(e);
}
</script>
