<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Financeiro & Veículos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23134e4a'/%3E%3Cpath d='M20 60 L28 40 Q30 36 35 36 L65 36 Q70 36 72 40 L80 60' stroke='%23fbbf24' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Crect x='16' y='58' width='68' height='16' rx='6' fill='%23fbbf24'/%3E%3Ccircle cx='30' cy='78' r='7' fill='%23134e4a'/%3E%3Ccircle cx='70' cy='78' r='7' fill='%23134e4a'/%3E%3Crect x='42' y='20' width='16' height='12' rx='2' fill='%2334d399'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273548;--accent:#34d399;--accent2:#fbbf24;--danger:#f87171;--text:#e2e8f0;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px;font-size:15px}
header{background:linear-gradient(135deg,#134e4a,#0f172a);padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border)}
header svg{width:32px;height:32px}
header h1{font-size:17px;font-weight:600}
header .sub{font-size:11px;color:var(--muted)}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
.card h2{font-size:14px;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.big{font-size:22px;font-weight:700}
.muted{color:var(--muted);font-size:12px}
.bar-bg{background:var(--card2);border-radius:8px;height:10px;overflow:hidden;margin:8px 0}
.bar-fill{height:100%;background:var(--accent);transition:width .3s}
.bar-fill.warn{background:var(--accent2)}
.bar-fill.over{background:var(--danger)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:15px;margin-bottom:8px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
button{background:var(--accent);color:#0f172a;border:none;padding:10px 14px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
button.danger{background:var(--danger);color:#1a0505}
button.small{padding:6px 10px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list-item{background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list-item .info{flex:1;min-width:0}
.list-item .info b{display:block;font-size:14px}
.list-item .info span{font-size:12px;color:var(--muted);display:block}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--card);border:1px solid var(--border);white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20}
nav button{flex:1;background:none;border:none;color:var(--muted);padding:10px 2px;font-size:11px;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{color:var(--accent)}
.hidden{display:none !important}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{background:var(--card2);color:var(--muted);white-space:nowrap;font-size:12px;padding:7px 12px}
.tabs button.active{background:var(--accent);color:#0f172a}
.alert-banner{background:#3a2410;border:1px solid var(--accent2);color:var(--accent2);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
.alert-banner.danger{background:#3a1414;border-color:var(--danger);color:var(--danger)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:50}
.modal{background:var(--card);width:100%;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px}
.modal h3{margin-bottom:10px}
.close-x{float:right;background:none;color:var(--muted);font-size:20px;padding:0 6px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13px}
.category-color{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
</style>
</head>
<body>

<header>
<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#134e4a"/><path d="M20 60 L28 40 Q30 36 35 36 L65 36 Q70 36 72 40 L80 60" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="16" y="58" width="68" height="16" rx="6" fill="#fbbf24"/><circle cx="30" cy="78" r="7" fill="#134e4a"/><circle cx="70" cy="78" r="7" fill="#134e4a"/><rect x="42" y="20" width="16" height="12" rx="2" fill="#34d399"/></svg>
<div><h1>Financeiro & Veículos</h1><div class="sub" id="headerSub">carregando...</div></div>
</header>

<main id="app"></main>

<nav>
<button id="navDash" onclick="setScreen('dash')">📊<span>Painel</span></button>
<button id="navFin" onclick="setScreen('fin')">💰<span>Gastos</span></button>
<button id="navVei" onclick="setScreen('vei')">🚗<span>Veículos</span></button>
<button id="navComp" onclick="setScreen('comp')">📅<span>Comparar</span></button>
<button id="navCfg" onclick="setScreen('cfg')">⚙️<span>Config</span></button>
</nav>

<div id="modalRoot"></div>

<script>
/* ======================================================================
   DATA LAYER
   Orçamento: só existem GASTOS (sem lançamento de receita/entrada).
   Categoria = Grupo (ex: Veículo, Moradia) + Subcategoria (ex: Combustível).
====================================================================== */
const STORAGE_KEY = 'fv_data_v3';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);

const GRUPOS = [
  {id:'veiculo', nome:'Veículo', cor:'#fbbf24', veiculo:true, subs:[
    {id:'combustivel', nome:'Combustível'},
    {id:'manutencao', nome:'Manutenção'},
    {id:'revisao', nome:'Revisão'},
    {id:'ipva', nome:'IPVA'},
    {id:'seguro', nome:'Seguro'},
    {id:'vistoria', nome:'Vistoria'}
  ]},
  {id:'moradia', nome:'Moradia', cor:'#34d399', veiculo:false, subs:[
    {id:'aluguel', nome:'Aluguel/Financiamento'},
    {id:'condominio', nome:'Condomínio'},
    {id:'agua', nome:'Água'},
    {id:'luz', nome:'Luz'},
    {id:'internet', nome:'Internet/TV'},
    {id:'manutencao_casa', nome:'Manutenção da casa'},
    {id:'moradia_outros', nome:'Outros'}
  ]},
  {id:'alimentacao', nome:'Alimentação', cor:'#fb923c', veiculo:false, subs:[
    {id:'mercado', nome:'Mercado'},
    {id:'restaurante', nome:'Restaurante/Delivery'},
    {id:'alimentacao_outros', nome:'Outros'}
  ]},
  {id:'saude', nome:'Saúde', cor:'#f472b6', veiculo:false, subs:[
    {id:'consulta', nome:'Consulta'},
    {id:'exame', nome:'Exame'},
    {id:'farmacia', nome:'Farmácia'},
    {id:'plano_saude', nome:'Plano de saúde'},
    {id:'saude_outros', nome:'Outros'}
  ]},
  {id:'lazer', nome:'Lazer', cor:'#818cf8', veiculo:false, subs:[
    {id:'viagem', nome:'Viagem'},
    {id:'streaming', nome:'Cinema/Streaming'},
    {id:'hobby', nome:'Hobby'},
    {id:'lazer_outros', nome:'Outros'}
  ]},
  {id:'educacao', nome:'Educação', cor:'#38bdf8', veiculo:false, subs:[
    {id:'mensalidade', nome:'Mensalidade'},
    {id:'material', nome:'Material'},
    {id:'curso', nome:'Curso'},
    {id:'educacao_outros', nome:'Outros'}
  ]},
  {id:'outros', nome:'Outros', cor:'#94a3b8', veiculo:false, subs:[
    {id:'outros_geral', nome:'Geral'}
  ]}
];
function grupoDaSub(subId){ return GRUPOS.find(g=>g.subs.some(s=>s.id===subId)); }
function subObj(subId){ const g=grupoDaSub(subId); return g ? g.subs.find(s=>s.id===subId) : null; }

// Áreas do veículo — mantidas simples, de propósito
const AREAS_PADRAO = [
  {id:'motor', nome:'Motor'},
  {id:'suspensao', nome:'Suspensão'},
  {id:'eletrica', nome:'Elétrica'},
  {id:'lataria', nome:'Lataria'}
];

// Opções rápidas de duração de garantia
const DURACOES_GARANTIA = [
  {id:'3m', nome:'3 meses', anos:0, meses:3},
  {id:'6m', nome:'6 meses', anos:0, meses:6},
  {id:'1a', nome:'1 ano', anos:1, meses:0},
  {id:'2a', nome:'2 anos', anos:2, meses:0},
  {id:'3a', nome:'3 anos', anos:3, meses:0},
  {id:'5a', nome:'5 anos', anos:5, meses:0},
  {id:'10a', nome:'10 anos', anos:10, meses:0},
  {id:'custom', nome:'Escolher data exata...', anos:null, meses:null}
];

function defaultData(){
  return {
    config:{
      weekStartDay: 1, // 0=domingo ... 1=segunda
      weeklyBudget: 0,
      monthlyBudget: 0,
      alertPercent: 80,
      rolloverWeekly: true
    },
    areas: AREAS_PADRAO,
    veiculos: [],
    motoristas: [],
    gastos: []
  };
}

let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const p = JSON.parse(raw);
    return {
      config: Object.assign(defaultData().config, p.config||{}),
      areas: p.areas && p.areas.length ? p.areas : AREAS_PADRAO,
      veiculos: p.veiculos || [],
      motoristas: p.motoristas || [],
      gastos: p.gastos || []
    };
  }catch(e){
    console.error('Erro ao carregar dados, iniciando vazio.', e);
    return defaultData();
  }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  renderHeaderSub();
}

/* ====================== DATE / HELPERS ====================== */
function parseDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(iso){ return parseDate(iso).toLocaleDateString('pt-BR'); }
function fmtMoney(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function fmtKm(km){ return (km||0).toLocaleString('pt-BR')+' km'; }
function addYearsMonths(dateISO, anos, meses){
  let [y,m,d] = dateISO.split('-').map(Number);
  const dt = new Date(y + anos, (m-1) + meses, d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function weekRange(date){
  const start = new Date(date);
  const diff = (start.getDay() - DB.config.weekStartDay + 7) % 7;
  start.setDate(start.getDate() - diff);
  start.setHours(0,0,0,0);
  const end = new Date(start);
  end.setDate(end.getDate()+6);
  end.setHours(23,59,59,999);
  return {start,end};
}
function isoOf(d){ return d.toISOString().slice(0,10); }
function weekLabel(range){
  const sameMonth = range.start.getMonth()===range.end.getMonth();
  const s = range.start.toLocaleDateString('pt-BR', sameMonth?{day:'2-digit'}:{day:'2-digit',month:'2-digit'});
  const e = range.end.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
  return `${s} – ${e}`;
}
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){ const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long', year:'numeric'}); }

/* ====================== ORÇAMENTO (semanal / mensal) ====================== */
function sumGastos(startISO, endISO, filterFn){
  return DB.gastos.filter(g => g.date>=startISO && g.date<=endISO && (!filterFn || filterFn(g))).reduce((s,g)=>s+Number(g.valor),0);
}
function escopoMatch(g, alvo){ const e = g.escopo || 'ambos'; return e==='ambos' || e===alvo; }

function weeklyBudgetStatus(refDate){
  const cfg = DB.config;
  const range = weekRange(refDate);
  const filtro = g => escopoMatch(g,'semanal');
  const gastoSemana = sumGastos(isoOf(range.start), isoOf(range.end), filtro);
  let saldo = cfg.weeklyBudget - gastoSemana;
  let rollover = 0;

  if(cfg.rolloverWeekly && cfg.weeklyBudget>0 && DB.gastos.length){
    const firstDate = DB.gastos.reduce((min,g)=> g.date<min?g.date:min, DB.gastos[0].date);
    let cursor = weekRange(parseDate(firstDate)).start;
    while(cursor < range.start){
      const r = weekRange(cursor);
      const gasto = sumGastos(isoOf(r.start), isoOf(r.end), filtro);
      rollover += (cfg.weeklyBudget - gasto);
      cursor = new Date(r.end); cursor.setDate(cursor.getDate()+1);
    }
    saldo = cfg.weeklyBudget - gastoSemana + rollover;
  }
  return {gasto:gastoSemana, orcamento:cfg.weeklyBudget, saldo, rollover, range};
}
function monthlyBudgetStatus(refDate){
  const key = monthKey(isoOf(refDate));
  const start = key+'-01';
  const end = isoOf(new Date(refDate.getFullYear(), refDate.getMonth()+1, 0));
  const gasto = sumGastos(start, end, g=>escopoMatch(g,'mensal'));
  return {gasto, orcamento: DB.config.monthlyBudget, saldo: DB.config.monthlyBudget - gasto, key, start, end};
}
function gastoDoMes(key){
  const start = key+'-01';
  const [y,m] = key.split('-').map(Number);
  const end = isoOf(new Date(y, m, 0));
  return DB.gastos.filter(g=>g.date>=start && g.date<=end);
}

/* ====================== SCREEN STATE ====================== */
let currentScreen = 'dash';
function setScreen(s){
  currentScreen = s;
  ['navDash','navFin','navVei','navComp','navCfg'].forEach(id=>document.getElementById(id).classList.remove('active'));
  const map = {dash:'navDash', fin:'navFin', vei:'navVei', comp:'navComp', cfg:'navCfg'};
  document.getElementById(map[s]).classList.add('active');
  render();
}
function renderHeaderSub(){
  const el = document.getElementById('headerSub');
  if(!el) return;
  el.textContent = `${DB.gastos.length} gasto(s) · ${DB.veiculos.length} veículo(s)`;
}
function render(){
  const app = document.getElementById('app');
  if(currentScreen==='dash') app.innerHTML = renderDash();
  else if(currentScreen==='fin') app.innerHTML = renderFin();
  else if(currentScreen==='vei') app.innerHTML = renderVei();
  else if(currentScreen==='comp') app.innerHTML = renderComp();
  else if(currentScreen==='cfg') app.innerHTML = renderCfg();
  renderHeaderSub();
}

/* ====================== DASHBOARD ====================== */
function renderDash(){
  const now = new Date();
  const w = weeklyBudgetStatus(now);
  const m = monthlyBudgetStatus(now);
  const wPct = w.orcamento>0 ? Math.min(100, Math.round((w.gasto/w.orcamento)*100)) : 0;
  const mPct = m.orcamento>0 ? Math.min(100, Math.round((m.gasto/m.orcamento)*100)) : 0;
  const alertP = DB.config.alertPercent;

  let banners = '';
  if(w.orcamento>0 && (w.gasto/w.orcamento*100)>=100) banners += `<div class="alert-banner danger">⚠️ Orçamento semanal estourado em ${fmtMoney(w.gasto-w.orcamento)}.</div>`;
  else if(w.orcamento>0 && (w.gasto/w.orcamento*100)>=alertP) banners += `<div class="alert-banner">⚠️ Você já usou ${wPct}% do orçamento semanal.</div>`;
  if(m.orcamento>0 && (m.gasto/m.orcamento*100)>=100) banners += `<div class="alert-banner danger">⚠️ Orçamento mensal estourado em ${fmtMoney(m.gasto-m.orcamento)}.</div>`;
  else if(m.orcamento>0 && (m.gasto/m.orcamento*100)>=alertP) banners += `<div class="alert-banner">⚠️ Você já usou ${mPct}% do orçamento mensal.</div>`;

  const recentes = [...DB.gastos].sort((a,b)=>b.date.localeCompare(a.date) || b.criadoEm-a.criadoEm).slice(0,6);

  return `
  ${banners}
  <div class="card">
    <h2>Semana atual (${weekLabel(w.range)})</h2>
    <div class="row"><span class="muted">Gasto</span><b>${fmtMoney(w.gasto)}</b></div>
    <div class="row"><span class="muted">Orçamento</span><b>${fmtMoney(w.orcamento)}</b></div>
    ${DB.config.rolloverWeekly ? `<div class="row"><span class="muted">Saldo acumulado (c/ rollover)</span><b style="color:${w.saldo<0?'var(--danger)':'var(--accent)'}">${fmtMoney(w.saldo)}</b></div>`:''}
    <div class="bar-bg"><div class="bar-fill ${wPct>=100?'over':wPct>=alertP?'warn':''}" style="width:${wPct}%"></div></div>
  </div>
  <div class="card">
    <h2>Mês atual (${monthLabel(m.key)})</h2>
    <div class="row"><span class="muted">Gasto</span><b>${fmtMoney(m.gasto)}</b></div>
    <div class="row"><span class="muted">Orçamento</span><b>${fmtMoney(m.orcamento)}</b></div>
    <div class="row"><span class="muted">Saldo</span><b style="color:${m.saldo<0?'var(--danger)':'var(--accent)'}">${fmtMoney(m.saldo)}</b></div>
    <div class="bar-bg"><div class="bar-fill ${mPct>=100?'over':mPct>=alertP?'warn':''}" style="width:${mPct}%"></div></div>
  </div>
  <div class="card">
    <h2>Últimos gastos</h2>
    ${recentes.length ? recentes.map(gastoItem).join('') : '<div class="empty">Nenhum gasto ainda.</div>'}
  </div>
  <button onclick="openGastoModal()">+ Gasto</button>
  `;
}

function gastoItem(g){
  const sub = subObj(g.subcategoria) || {nome:g.subcategoria};
  const grupo = grupoDaSub(g.subcategoria) || {nome:'', cor:'#94a3b8'};
  const natureza = g.natureza==='superfluo' ? '<span class="tag" style="color:var(--accent2);border-color:var(--accent2)">supérfluo</span>' : '<span class="tag" style="color:var(--accent);border-color:var(--accent)">essencial</span>';
  const escopoTxt = {semanal:'semana', mensal:'mês', ambos:'semana + mês'}[g.escopo||'ambos'];
  const v = g.veiculoId ? DB.veiculos.find(v=>v.id===g.veiculoId) : null;
  const area = g.area ? DB.areas.find(a=>a.id===g.area) : null;
  const itensLinha = g.itens && g.itens.length ? `<span>Itens: ${g.itens.map(i=>{ const a=DB.areas.find(x=>x.id===i.area); return `${a?a.nome:i.area}${i.descricao?' ('+i.descricao+')':''}`; }).join(', ')}</span>` : '';
  const garantiaLinha = g.garantiaAte ? `<span>Garantia até ${fmtDate(g.garantiaAte)}${garantiaVencida(g.garantiaAte)?' — vencida':''}</span>` : '';
  const kmLinha = g.km ? `<span>Km: ${fmtKm(g.km)}${g.litros?' · '+g.litros+' L':''}</span>` : '';
  return `<div class="list-item">
    <div class="info">
      <b><span class="category-color" style="background:${grupo.cor}"></span>${g.descricao||sub.nome}</b>
      <span>${fmtDate(g.date)} · ${grupo.nome} · ${sub.nome}${v?' · '+v.nome:''}${area?' · '+area.nome:''} · conta em: ${escopoTxt}</span>
      ${kmLinha}
      ${itensLinha}
      ${garantiaLinha}
    </div>
    <div style="text-align:right">
      <div style="color:var(--text);font-weight:700">${fmtMoney(g.valor)}</div>
      <div style="margin-top:4px">${natureza}</div>
      <button class="small secondary" onclick="deleteGasto('${g.id}')">excluir</button>
    </div>
  </div>`;
}
function garantiaVencida(dataISO){ return dataISO && dataISO < todayISO(); }
function deleteGasto(id){
  if(!confirm('Excluir este gasto?')) return;
  DB.gastos = DB.gastos.filter(x=>x.id!==id);
  save(); render();
}

/* ====================== TELA DE GASTOS (extrato) ====================== */
let finFilterMonth = monthKey(todayISO());
let finFilterNatureza = 'todos';
function renderFin(){
  const months = [...new Set(DB.gastos.map(g=>monthKey(g.date)))].sort().reverse();
  if(!months.includes(finFilterMonth)) months.unshift(finFilterMonth);
  const todosDoMes = gastoDoMes(finFilterMonth).sort((a,b)=>b.date.localeCompare(a.date));
  const totalGasto = todosDoMes.reduce((s,g)=>s+Number(g.valor),0);
  const essencial = todosDoMes.filter(g=>g.natureza!=='superfluo').reduce((s,g)=>s+Number(g.valor),0);
  const superfluo = todosDoMes.filter(g=>g.natureza==='superfluo').reduce((s,g)=>s+Number(g.valor),0);
  const pctSuperfluo = totalGasto>0 ? Math.round((superfluo/totalGasto)*100) : 0;

  const list = finFilterNatureza==='todos' ? todosDoMes : todosDoMes.filter(g=>(g.natureza||'essencial')===finFilterNatureza);

  return `
  <div class="card">
    <h2>Gastos do mês</h2>
    <select onchange="finFilterMonth=this.value;render()">
      ${months.map(k=>`<option value="${k}" ${k===finFilterMonth?'selected':''}>${monthLabel(k)}</option>`).join('')}
    </select>
    <div class="row"><span class="muted">Total gasto</span><b>${fmtMoney(totalGasto)}</b></div>
    <div class="row"><span class="muted">Orçamento mensal</span><b>${fmtMoney(DB.config.monthlyBudget)}</b></div>
    <div class="row"><span class="muted">— essencial</span><span>${fmtMoney(essencial)}</span></div>
    <div class="row"><span class="muted">— supérfluo</span><span>${fmtMoney(superfluo)} (${pctSuperfluo}% do mês)</span></div>

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function onGrupoChange(){
  const grupoId = document.getElementById('gGrupo').value;
  const grupo = GRUPOS.find(g=>g.id===grupoId);
  const subSel = document.getElementById('gSub');
  subSel.innerHTML = grupo.subs.map(s=>`<option value="${s.id}">${s.nome}</option>`).join('');
  onSubChange();
}

function onSubChange(){
  const grupoId = document.getElementById('gGrupo').value;
  const grupo = GRUPOS.find(g=>g.id===grupoId);
  const subId = document.getElementById('gSub').value;
  const isVeiculo = !!grupo.veiculo;

  document.getElementById('gVeiculoBox').classList.toggle('hidden', !isVeiculo);
  document.getElementById('gAreaBox').classList.toggle('hidden', !isVeiculo);
  document.getElementById('gKmBox').classList.toggle('hidden', !isVeiculo);
  document.getElementById('gLitrosBox').classList.toggle('hidden', !(isVeiculo && subId==='combustivel'));
  document.getElementById('gGarantiaBox').classList.toggle('hidden', !isVeiculo);
  if(isVeiculo) populateAreaSelect();

  const isRevisao = isVeiculo && subId==='revisao';
  document.getElementById('gRevisaoBox').classList.toggle('hidden', !isRevisao);
  document.getElementById('gSimplesBox').classList.toggle('hidden', isRevisao);
  if(isRevisao && revisaoItensTemp.length===0) addRevisaoItemRow();
}

function populateAreaSelect(){
  const sel = document.getElementById('gArea');
  if(!sel) return;
  const prev = sel.value;
  sel.innerHTML = DB.areas.map(a=>`<option value="${a.id}">${a.nome}</option>`).join('') + `<option value="__nova__">+ Nova área...</option>`;
  if(DB.areas.some(a=>a.id===prev)) sel.value = prev;
}
function onAreaSelectChange(){
  const sel = document.getElementById('gArea');
  if(sel.value==='__nova__'){
    const nome = prompt('Nome da nova área do veículo:');
    if(nome && nome.trim()){
      const nova = {id:uid(), nome:nome.trim()};
      DB.areas.push(nova);
      save();
      populateAreaSelect();
      sel.value = nova.id;
    } else {
      sel.value = DB.areas[0]?.id || '';
    }
  }
}

function onGarantiaToggle(){
  const checked = document.getElementById('gGarantia').checked;
  document.getElementById('gGarantiaDuracaoBox').classList.toggle('hidden', !checked);
}
function onGarantiaDuracaoChange(){
  const val = document.getElementById('gGarantiaDuracao').value;
  document.getElementById('gGarantiaData').classList.toggle('hidden', val!=='custom');
}

function addRevisaoItemRow(){
  revisaoItensTemp.push({key:uid(), area:(DB.areas[0]?.id||''), descricao:'', valor:''});
  renderRevisaoItensList();
}
function removeRevisaoItemRow(key){
  revisaoItensTemp = revisaoItensTemp.filter(i=>i.key!==key);
  renderRevisaoItensList();
}
function updateRevisaoItemField(key, field, value){
  const it = revisaoItensTemp.find(i=>i.key===key);
  if(it) it[field] = value;
  updateRevisaoTotal();
}
function updateRevisaoTotal(){
  const total = revisaoItensTemp.reduce((s,i)=>s+(parseFloat(i.valor)||0),0);
  const el = document.getElementById('revisaoTotalDisplay');
  if(el) el.textContent = fmtMoney(total);
}
function renderRevisaoItensList(){
  const html = revisaoItensTemp.map(it=>`
    <div class="list-item" style="flex-direction:column;align-items:stretch;gap:6px">
      <div class="grid2">
        <select onchange="updateRevisaoItemField('${it.key}','area',this.value)">${DB.areas.map(a=>`<option value="${a.id}" ${a.id===it.area?'selected':''}>${a.nome}</option>`).join('')}</select>
        <input placeholder="Item (ex: troca de óleo)" value="${it.descricao}" oninput="updateRevisaoItemField('${it.key}','descricao',this.value)">
      </div>
      <input type="number" step="0.01" placeholder="Valor" value="${it.valor}" oninput="updateRevisaoItemField('${it.key}','valor',this.value)">
      <button type="button" class="small secondary" onclick="removeRevisaoItemRow('${it.key}')">remover item</button>
    </div>
  `).join('');
  document.getElementById('revisaoItensList').innerHTML = html || '<p class="muted">Nenhum item ainda.</p>';
  updateRevisaoTotal();
}

function calcGarantiaAte(dataISO){
  const dur = document.getElementById('gGarantiaDuracao').value;
  if(dur==='custom') return document.getElementById('gGarantiaData').value || null;
  const d = DURACOES_GARANTIA.find(x=>x.id===dur);
  return d ? addYearsMonths(dataISO, d.anos, d.meses) : null;
}

function saveGasto(){
  const grupoId = document.getElementById('gGrupo').value;
  const grupo = GRUPOS.find(g=>g.id===grupoId);
  const subcategoria = document.getElementById('gSub').value;
  const isVeiculo = !!grupo.veiculo;
  const data = document.getElementById('gData').value || todayISO();
  const natureza = document.getElementById('gNatureza').value;
  const escopo = document.getElementById('gEscopo').value;

  if(isVeiculo && !DB.veiculos.length){ alert('Cadastre um veículo primeiro.'); return; }

  const base = {id:uid(), date:data, subcategoria, natureza, escopo, criadoEm:Date.now()};

  if(isVeiculo){
    base.veiculoId = document.getElementById('gVeiculoId').value;
    const kmVal = parseInt(document.getElementById('gKm').value);
    if(kmVal>0) base.km = kmVal;
    if(document.getElementById('gGarantia').checked){
      base.garantiaAte = calcGarantiaAte(data);
    }
  }

  if(isVeiculo && subcategoria==='revisao'){
    const validos = revisaoItensTemp.filter(i=>parseFloat(i.valor)>0);
    if(!validos.length){ alert('Adicione ao menos um item com valor.'); return; }
    base.valor = validos.reduce((s,i)=>s+parseFloat(i.valor),0);
    base.descricao = 'Revisão';
    base.itens = validos.map(i=>({area:i.area, descricao:i.descricao.trim(), valor:parseFloat(i.valor)}));
  } else {
    const valor = parseFloat(document.getElementById('gValor').value);
    if(!valor || valor<=0){ alert('Informe um valor válido.'); return; }
    base.valor = valor;
    base.descricao = document.getElementById('gDesc').value.trim();
    if(isVeiculo){
      base.area = document.getElementById('gArea').value;
      if(subcategoria==='combustivel'){
        const litros = parseFloat(document.getElementById('gLitros').value);
        if(litros>0) base.litros = litros;
      }
    }
  }

  DB.gastos.push(base);
  save(); closeModal(); render();
}

let veiTab = 'gastos';
let veiAreaFilter = 'todas';
function renderVei(){
  return `
  <div class="tabs">
    <button class="${veiTab==='gastos'?'active':''}" onclick="veiTab='gastos';render()">Gastos</button>

function kmAtualDoVeiculo(veiculoId){
  let max = 0;
  DB.gastos.forEach(g=>{ if(g.veiculoId===veiculoId && g.km && g.km>max) max=g.km; });
  return max;
}

function renderVeiGastos(){
  let list = DB.gastos.filter(g=>{ const gr=grupoDaSub(g.subcategoria); return gr && gr.veiculo; }).sort((a,b)=>b.date.localeCompare(a.date));
  if(veiAreaFilter!=='todas'){
    list = list.filter(g => g.area===veiAreaFilter || (g.itens && g.itens.some(i=>i.area===veiAreaFilter)));
  }
  return `
  <div class="card">
    <h2>Gastos com veículos</h2>
    <label>Filtrar por área</label>
    <select onchange="veiAreaFilter=this.value;render()">
      <option value="todas" ${veiAreaFilter==='todas'?'selected':''}>Todas as áreas</option>
      ${DB.areas.map(a=>`<option value="${a.id}" ${a.id===veiAreaFilter?'selected':''}>${a.nome}</option>`).join('')}
    </select>
    ${!DB.veiculos.length ? '<div class="empty">Cadastre um veículo primeiro na aba "Veículos".</div>' : list.length ? list.map(gastoItem).join('') : '<div class="empty">Nenhum gasto registrado para esse filtro.</div>'}
  </div>
  ${DB.veiculos.length ? '<button onclick="openGastoModal()">+ Gasto</button>' : ''}
  `;
}

function renderVeiAreas(){
  const garantias = [];
  DB.gastos.forEach(g=>{
    if(!g.garantiaAte) return;
    const v = DB.veiculos.find(v=>v.id===g.veiculoId);
    const a = DB.areas.find(x=>x.id===g.area);
    garantias.push({data:g.garantiaAte, area:a?a.nome:'—', descricao:g.descricao, veiculo:v?v.nome:'?'});
  });
  garantias.sort((a,b)=>a.data.localeCompare(b.data));

  const porArea = {};
  DB.gastos.forEach(g=>{
    if(g.area) (porArea[g.area]=porArea[g.area]||[]).push({date:g.date, km:g.km, veiculoId:g.veiculoId, descricao:g.descricao});
    (g.itens||[]).forEach(i=>{
      if(i.area) (porArea[i.area]=porArea[i.area]||[]).push({date:g.date, km:g.km, veiculoId:g.veiculoId, descricao:i.descricao});
    });
  });
  let historicoHtml = '';
  Object.keys(porArea).forEach(areaId=>{
    const area = DB.areas.find(a=>a.id===areaId);
    const comKm = porArea[areaId].filter(e=>e.km);
    if(!comKm.length) return;
    const porVeiculo = {};
    comKm.forEach(e=> (porVeiculo[e.veiculoId]=porVeiculo[e.veiculoId]||[]).push(e));
    let linhas = '';
    Object.keys(porVeiculo).forEach(vid=>{
      const v = DB.veiculos.find(v=>v.id===vid);
      const lista = porVeiculo[vid].sort((a,b)=>a.km-b.km);
      lista.forEach((e,idx)=>{
        const anterior = lista[idx-1];
        const delta = anterior ? (e.km-anterior.km) : null;
        linhas += `<div class="row"><span class="muted">${v?v.nome:'?'} · ${fmtDate(e.date)} · ${fmtKm(e.km)}${e.descricao?' — '+e.descricao:''}</span><span>${delta!==null?'durou '+fmtKm(delta):'—'}</span></div>`;
      });
    });
    if(linhas) historicoHtml += `<div style="margin-bottom:12px"><b>${area?area.nome:areaId}</b>${linhas}</div>`;
  });

  let consumoHtml = '';
  DB.veiculos.forEach(v=>{
    const abastecimentos = DB.gastos.filter(g=>g.veiculoId===v.id && g.subcategoria==='combustivel' && g.km && g.litros).sort((a,b)=>a.km-b.km);
    if(abastecimentos.length<2) return;
    let linhas = '';
    for(let i=1;i<abastecimentos.length;i++){
      const kmRodado = abastecimentos[i].km - abastecimentos[i-1].km;
      const consumo = kmRodado>0 ? (kmRodado/abastecimentos[i].litros).toFixed(1) : '—';
      linhas += `<div class="row"><span class="muted">${fmtDate(abastecimentos[i].date)} · ${fmtKm(kmRodado)} rodados</span><span>${consumo} km/l</span></div>`;
    }
    consumoHtml += `<div style="margin-bottom:12px"><b>${v.nome}</b>${linhas}</div>`;
  });

  return `
  <div class="card">
    <h2>Áreas do veículo</h2>
    <p class="muted" style="margin-bottom:10px">Cadastradas uma vez, aparecem prontas nos formulários de gasto.</p>
    ${DB.areas.map(a=>`<div class="list-item"><div class="info"><b>${a.nome}</b></div><button class="small secondary" onclick="deleteArea('${a.id}')">excluir</button></div>`).join('')}
    <button onclick="addAreaPrompt()">+ Nova área</button>
  </div>
  <div class="card">
    <h2>Durabilidade por área</h2>
    ${historicoHtml || '<div class="empty">Registre a quilometragem nos gastos de veículo para ver aqui quanto durou cada peça/serviço.</div>'}
  </div>
  <div class="card">
    <h2>Consumo de combustível (km/l)</h2>
    ${consumoHtml || '<div class="empty">Registre km e litros em ao menos dois abastecimentos para calcular o consumo.</div>'}
  </div>
  <div class="card">
    <h2>Garantias cadastradas</h2>
    ${garantias.length ? garantias.map(g=>`<div class="list-item"><div class="info"><b>${g.area}${g.descricao?' — '+g.descricao:''}</b><span>${g.veiculo} · vence em ${fmtDate(g.data)}${garantiaVencida(g.data)?' (vencida)':''}</span></div></div>`).join('') : '<div class="empty">Nenhuma garantia cadastrada ainda.</div>'}
  </div>
  `;
}

function deleteArea(id){
  const emUso = DB.gastos.some(g=>g.area===id || (g.itens&&g.itens.some(i=>i.area===id)));
  if(emUso && !confirm('Essa área já foi usada em algum gasto. Excluir mesmo assim? (os gastos antigos continuam com o registro)')) return;
  DB.areas = DB.areas.filter(a=>a.id!==id);

/* ====================== COMPARATIVO ====================== */
function renderComp(){
  const months = [...new Set(DB.gastos.map(g=>monthKey(g.date)))].sort().reverse();
  if(months.length<1) return '<div class="card"><div class="empty">Sem dados suficientes para comparar ainda.</div></div>';
  const a = months[0], b = months[1]||months[0];
  return `
  <div class="card">
    <h2>Comparar meses</h2>
    <div class="grid2">
      <div><label>Mês A</label><select id="compA" onchange="render()">${months.map(k=>`<option value="${k}" ${k===a?'selected':''}>${monthLabel(k)}</option>`).join('')}</select></div>
      <div><label>Mês B</label><select id="compB" onchange="render()">${months.map(k=>`<option value="${k}" ${k===b?'selected':''}>${monthLabel(k)}</option>`).join('')}</select></div>
    </div>
    ${renderCompTable(document.getElementById('compA')?document.getElementById('compA').value:a, document.getElementById('compB')?document.getElementById('compB').value:b)}
  </div>
  <div class="card">
    <h2>Histórico essencial x supérfluo</h2>
    <p class="muted" style="margin-bottom:8px">Acompanhe mês a mês quanto foi gasto com supérfluos, pra identificar padrões.</p>
    ${months.map(k=>{
      const gastos = gastoDoMes(k);
      const total = gastos.reduce((s,g)=>s+Number(g.valor),0);
      const sup = gastos.filter(g=>g.natureza==='superfluo').reduce((s,g)=>s+Number(g.valor),0);
      const pct = total>0 ? Math.round((sup/total)*100) : 0;
      return `<div class="row"><span class="muted">${monthLabel(k)}</span><span>${fmtMoney(sup)} supérfluo (${pct}%)</span></div>`;
    }).join('')}
  </div>`;
}
function renderCompTable(a,b){
  const byGrupo = (key)=>{
    const map = {};
    gastoDoMes(key).forEach(g=>{
      const gr = grupoDaSub(g.subcategoria);
      const id = gr ? gr.id : 'outros';
      map[id] = (map[id]||0) + Number(g.valor);
    });
    return map;
  };
  const ca = byGrupo(a), cb = byGrupo(b);
  const allGrupos = [...new Set([...Object.keys(ca), ...Object.keys(cb)])];
  const totalA = Object.values(ca).reduce((s,v)=>s+v,0);
  const totalB = Object.values(cb).reduce((s,v)=>s+v,0);
  return `
  <div style="margin-top:10px">
    ${allGrupos.map(id=>{
      const grupo = GRUPOS.find(g=>g.id===id)||{nome:id,cor:'#94a3b8'};
      return `<div class="row"><span><span class="category-color" style="background:${grupo.cor}"></span>${grupo.nome}</span><span>${fmtMoney(ca[id]||0)} vs ${fmtMoney(cb[id]||0)}</span></div>`;
    }).join('') || '<div class="empty">Sem gastos nesses meses.</div>'}
    <div class="row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:6px"><b>Total</b><b>${fmtMoney(totalA)} vs ${fmtMoney(totalB)}</b></div>
  </div>`;
}

/* ====================== CONFIG / BACKUP ====================== */
function renderCfg(){
  const c = DB.config;
  return `
  <div class="card">
    <h2>Orçamentos</h2>
    <p class="muted" style="margin-bottom:8px">Defina aqui quanto você planeja gastar — não há lançamento de entradas de dinheiro, só o registro dos gastos.</p>
    <label>Orçamento semanal (R$)</label>
    <input id="cfgWeekly" type="number" step="0.01" value="${c.weeklyBudget}">
    <label>Orçamento mensal (R$)</label>
    <input id="cfgMonthly" type="number" step="0.01" value="${c.monthlyBudget}">
    <label>Dia de início da semana</label>
    <select id="cfgWeekStart">
      ${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map((d,i)=>`<option value="${i}" ${i===c.weekStartDay?'selected':''}>${d}</option>`).join('')}
    </select>
    <label>Alertar quando gasto atingir (%)</label>
    <input id="cfgAlert" type="number" value="${c.alertPercent}">
    <label style="display:flex;align-items:center;gap:8px;margin-top:4px">
      <input type="checkbox" id="cfgRollover" style="width:auto" ${c.rolloverWeekly?'checked':''}> Acumular saldo semanal não usado (rollover)
    </label>
    <button onclick="saveConfig()">Salvar configurações</button>
  </div>

  <div class="card">
    <h2>Backup</h2>
    <p class="muted" style="margin-bottom:10px">Exporte regularmente e guarde no WhatsApp (mensagem para si mesmo) e no Google Drive, como de costume.</p>
    <div class="grid2">
      <button onclick="exportBackup()">Exportar JSON</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">Importar JSON</button>
    </div>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
  </div>

  <div class="card">
    <h2>Zona de risco</h2>
    <button class="danger" onclick="wipeAll()">Apagar todos os dados</button>
  </div>
  `;
}
function saveConfig(){
  DB.config.weeklyBudget = parseFloat(document.getElementById('cfgWeekly').value)||0;
  DB.config.monthlyBudget = parseFloat(document.getElementById('cfgMonthly').value)||0;
  DB.config.weekStartDay = parseInt(document.getElementById('cfgWeekStart').value);
  DB.config.alertPercent = parseFloat(document.getElementById('cfgAlert').value)||80;
  DB.config.rolloverWeekly = document.getElementById('cfgRollover').checked;
  save();
  alert('Configurações salvas.');
  render();
}
function exportBackup(){
  const payload = {...DB, exportadoEm: new Date().toISOString(), app:'financeiro-veiculos', versao:3};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `financeiro-veiculos-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importBackup(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const incoming = JSON.parse(e.target.result);
      const mode = confirm('OK = Mesclar com os dados atuais\nCancelar = Substituir tudo pelos dados importados') ? 'merge' : 'replace';
      if(mode==='replace'){
        DB = Object.assign(defaultData(), incoming);
      } else {
        const idsExistentes = new Set(DB.gastos.map(g=>g.id));
        (incoming.gastos||[]).forEach(g=>{ if(!idsExistentes.has(g.id)) DB.gastos.push(g); });
        const veiExistentes = new Set(DB.veiculos.map(v=>v.id));
        (incoming.veiculos||[]).forEach(v=>{ if(!veiExistentes.has(v.id)) DB.veiculos.push(v); });
        const drvExistentes = new Set(DB.motoristas.map(d=>d.id));
        (incoming.motoristas||[]).forEach(d=>{ if(!drvExistentes.has(d.id)) DB.motoristas.push(d); });
        const areaExistentes = new Set(DB.areas.map(a=>a.id));
        (incoming.areas||[]).forEach(a=>{ if(!areaExistentes.has(a.id)) DB.areas.push(a); });
      }
      save(); render();
      alert('Backup importado com sucesso.');
    }catch(err){
      alert('Arquivo inválido: '+err.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
function wipeAll(){
  if(!confirm('Isso vai apagar TODOS os dados deste aplicativo neste dispositivo. Tem certeza?')) return;
  if(!confirm('Confirme novamente: apagar tudo?')) return;
  DB = defaultData();
  save(); render();
}

/* ====================== PWA (manifest + service worker inline) ====================== */
const ICON_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23134e4a'/%3E%3Cpath d='M20 60 L28 40 Q30 36 35 36 L65 36 Q70 36 72 40 L80 60' stroke='%23fbbf24' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Crect x='16' y='58' width='68' height='16' rx='6' fill='%23fbbf24'/%3E%3Ccircle cx='30' cy='78' r='7' fill='%23134e4a'/%3E%3Ccircle cx='70' cy='78' r='7' fill='%23134e4a'/%3E%3Crect x='42' y='20' width='16' height='12' rx='2' fill='%2334d399'/%3E%3C/svg%3E";
function setupPWA(){
  try{
    const manifest = {
      name: "Financeiro & Veículos",
      short_name: "Fin+Veic",
      start_url: ".",
      scope: ".",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#134e4a",
      icons: [
        {src: ICON_SVG, sizes:"192x192", type:"image/svg+xml", purpose:"any maskable"},
        {src: ICON_SVG, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}
      ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(link);

    if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
      const swCode = `
        const CACHE='fv-cache-v3';
        self.addEventListener('install', e=>{ self.skipWaiting(); });
        self.addEventListener('activate', e=>{ self.clients.claim(); });
        self.addEventListener('fetch', e=>{
          e.respondWith(
            caches.open(CACHE).then(cache=>
              fetch(e.request).then(res=>{ cache.put(e.request, res.clone()); return res; })
                .catch(()=> cache.match(e.request))
            )
          );
        });
      `;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err=>console.warn('SW não registrado:', err));
    }
  }catch(e){ console.warn('PWA setup falhou:', e); }
}

/* ====================== INIT ====================== */
try{
  render();
  setupPWA();
}catch(e){
  document.getElementById('app').innerHTML = '<div class="card"><h2>Erro ao iniciar</h2><p>'+e.message+'</p></div>';
  console.error(e);
}
</script>
